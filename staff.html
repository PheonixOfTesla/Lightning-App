<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Door Staff - Lightning Pass</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffd700'/%3E%3Cstop offset='100%25' stop-color='%23ff8c00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M55 5L15 55h25L30 95l50-55H55L70 5z'/%3E%3C/svg%3E">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- QR Scanner: zxing-wasm IIFE (pinned v3.1.0, tryHarder for degraded frames) -->
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.0/dist/iife/reader/index.js"></script>

  <!-- Fallback: html5-qrcode for ID scanner PDF417 (zxing-wasm also supports PDF417) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pure-black: #0d1b2a;
      --card-black: #1b2838;
      --border-dark: #2d3748;
      --lightning-yellow: #ffd700;
      --electric-blue: #00d4ff;
      --electric-purple: #9d4edd;
      --neon-green: #39ff14;
      --danger-red: #ff0044;
      --white: #ffffff;
      --gray: #888;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pure-black);
      color: var(--white);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: var(--pure-black);
      border-bottom: 1px solid var(--border-dark);
      padding: 0.75rem 1rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--white);
      font-weight: 600;
    }

    .logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .entry-count {
      background: rgba(57, 255, 20, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      padding: 0.4rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-dark);
      color: var(--gray);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Main Content */
    main {
      padding-top: 60px;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Scanner Section */
    .scanner-section {
      background: var(--card-black);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .scanner-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-dark);
    }

    .scanner-tab {
      flex: 1;
      padding: 0.875rem;
      background: transparent;
      border: none;
      color: var(--gray);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .scanner-tab.active {
      color: var(--lightning-yellow);
      background: rgba(255, 215, 0, 0.1);
    }

    .scanner-viewport {
      aspect-ratio: 1;
      background: #000;
      position: relative;
    }

    #qr-reader {
      width: 100%;
      height: 100%;
    }

    #qr-reader video {
      object-fit: cover !important;
    }

    #id-reader-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-overlay svg {
      width: 60%;
      height: 60%;
      opacity: 0.5;
    }

    /* Scan Status Indicator */
    .scan-status {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .scan-status.ready {
      color: var(--lightning-yellow);
      border: 1px solid var(--lightning-yellow);
    }

    .scan-status.processing {
      color: var(--electric-blue);
      border: 1px solid var(--electric-blue);
    }

    .scan-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .scan-status.ready .dot {
      background: var(--lightning-yellow);
    }

    .scan-status.processing .dot {
      background: var(--electric-blue);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Result Card (replaces camera view) */
    .result-card {
      display: none;
      padding: 1.5rem;
      text-align: center;
      min-height: 280px;
    }

    .result-card.show {
      display: block;
    }

    .result-card.verified {
      background: linear-gradient(135deg, rgba(57, 255, 20, 0.15), rgba(57, 255, 20, 0.02));
    }

    .result-card.invalid {
      background: linear-gradient(135deg, rgba(255, 0, 68, 0.15), rgba(255, 0, 68, 0.02));
    }

    .result-card.already-used {
      background: linear-gradient(135deg, rgba(255, 140, 0, 0.15), rgba(255, 140, 0, 0.02));
    }

    .result-status {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
    }

    .result-card.verified .result-status {
      background: var(--neon-green);
      color: #000;
    }

    .result-card.invalid .result-status {
      background: var(--danger-red);
      color: #fff;
    }

    .result-card.already-used .result-status {
      background: #ff8c00;
      color: #000;
    }

    .result-guest-name {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 0.5rem;
    }

    .result-pass-id {
      font-size: 0.8rem;
      color: var(--gray);
      font-family: monospace;
      margin-bottom: 1.25rem;
    }

    .result-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      text-align: left;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 12px;
    }

    .result-info-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .result-info-label {
      font-size: 0.7rem;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-info-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
    }

    .result-info-value.paid {
      color: var(--neon-green);
    }

    .result-info-value.comp {
      color: var(--electric-purple);
    }

    .result-info-value.team {
      color: var(--lightning-yellow);
    }

    /* Rich result card layout */
    .result-ticket-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .result-pass-name {
      color: var(--white);
      font-weight: 500;
    }

    .result-qty {
      color: var(--lightning-yellow);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .result-ticket-divider {
      color: var(--gray);
    }

    .result-ticket-type {
      font-weight: 700;
    }

    .result-ticket-type.paid {
      color: var(--neon-green);
    }

    .result-ticket-type.comp {
      color: var(--electric-purple);
    }

    .result-ticket-type.team {
      color: var(--lightning-yellow);
    }

    .result-event-name {
      font-size: 1.1rem;
      color: var(--electric-blue);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .reentry-warning {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 140, 0, 0.15);
      border: 1px solid #ff8c00;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      margin-bottom: 0.75rem;
      color: #ff8c00;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .reentry-warning.hidden {
      display: none;
    }

    .reentry-icon {
      width: 20px;
      height: 20px;
      background: #ff8c00;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* ID Check Section */
    .id-check-section {
      background: var(--card-black);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .age-result {
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .age-result.over21 {
      background: rgba(57, 255, 20, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
    }

    .age-result.under21 {
      background: rgba(255, 0, 68, 0.15);
      border: 1px solid var(--danger-red);
      color: var(--danger-red);
    }

    .age-result-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .age-result-dob {
      font-size: 0.85rem;
      margin-top: 0.25rem;
      opacity: 0.8;
    }

    .manual-buttons {
      display: flex;
      gap: 0.75rem;
    }

    .manual-btn {
      flex: 1;
      padding: 0.875rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .manual-btn.over21 {
      background: var(--neon-green);
      color: #000;
    }

    .manual-btn.under21 {
      background: var(--border-dark);
      color: var(--white);
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 0.75rem;
    }

    .btn-action {
      flex: 1;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-admit {
      background: var(--lightning-yellow);
      color: #000;
    }

    .btn-admit:disabled {
      background: var(--border-dark);
      color: var(--gray);
      cursor: not-allowed;
    }

    .btn-deny {
      background: var(--danger-red);
      color: var(--white);
    }

    /* Loading & Error States */
    .loading-state, .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-dark);
      border-top-color: var(--lightning-yellow);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Passcode Entry Gate */
    .passcode-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--pure-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .passcode-box {
      background: var(--card-black);
      border: 1px solid var(--border-dark);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }

    .passcode-box h2 {
      color: var(--lightning-yellow);
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .passcode-box p {
      color: var(--gray);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .code-input {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .code-input input {
      width: 50px;
      height: 60px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      background: var(--pure-black);
      color: var(--white);
      outline: none;
    }

    .code-input input:focus {
      border-color: var(--lightning-yellow);
    }

    .passcode-btn {
      background: var(--lightning-yellow);
      color: #000;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .passcode-btn:hover {
      background: #ffcc00;
    }

    .passcode-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .passcode-error {
      color: var(--danger-red);
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    /* Hidden */
    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 390px) {
      .container { padding: 0.75rem; }
      .scanner-tab { font-size: 0.85rem; padding: 0.75rem; }
      .result-title { font-size: 1.25rem; }
      .btn-action { padding: 0.875rem; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <!-- Passcode Entry Gate -->
  <div class="passcode-overlay" id="passcodeOverlay">
    <div class="passcode-box">
      <h2>Door Staff</h2>
      <p>Enter 4-digit access code</p>
      <div class="code-input">
        <input type="text" maxlength="1" id="c1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
        <input type="text" maxlength="1" id="c2" inputmode="numeric" pattern="[0-9]" autocomplete="off">
        <input type="text" maxlength="1" id="c3" inputmode="numeric" pattern="[0-9]" autocomplete="off">
        <input type="text" maxlength="1" id="c4" inputmode="numeric" pattern="[0-9]" autocomplete="off">
      </div>
      <button class="passcode-btn" id="passcodeBtn" onclick="submitPasscode()">Enter</button>
      <div class="passcode-error" id="passcodeError"></div>
    </div>
  </div>

  <!-- Main App -->
  <div class="hidden" id="mainApp">
    <header>
      <a href="/" class="logo">
        <img src="/logo.png" alt="Lightning Pass">
        <span>Staff</span>
      </a>
      <div class="header-right">
        <div class="entry-count" id="entryCount">0 Admitted</div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </header>

    <main>
      <div class="container">
        <!-- Scanner Section -->
        <div class="scanner-section">
          <div class="scanner-tabs">
            <button class="scanner-tab active" data-mode="qr" onclick="switchScannerMode('qr')">QR Code</button>
            <button class="scanner-tab" data-mode="id" onclick="switchScannerMode('id')">ID Scan</button>
            <button class="scanner-tab" data-mode="manual" onclick="switchScannerMode('manual')">Manual</button>
          </div>

          <!-- QR Scanner Viewport -->
          <div class="scanner-viewport" id="qrViewport">
            <div id="qr-reader"></div>
            <div class="scanner-overlay" id="qrOverlay">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="10" y="10" width="80" height="80" rx="8" stroke-dasharray="10 5"/>
              </svg>
            </div>
            <div class="scan-status ready" id="scanStatus">
              <span class="dot"></span>
              <span id="scanStatusText">Ready to scan</span>
            </div>
          </div>

          <!-- ID Scanner Viewport -->
          <div class="scanner-viewport hidden" id="idViewport">
            <div id="id-reader"></div>
            <div class="scanner-overlay" id="idOverlay">
              <svg viewBox="0 0 100 30" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="5" y="5" width="90" height="20" rx="2" stroke-dasharray="5 3"/>
              </svg>
            </div>
            <div style="position: absolute; bottom: 1rem; left: 0; right: 0; text-align: center;">
              <span style="background: rgba(0,0,0,0.7); color: #fff; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem;">
                Scan barcode on back of ID
              </span>
            </div>
          </div>

          <!-- Manual Entry -->
          <div class="hidden" id="manualEntry" style="padding: 1rem;">
            <input type="text" id="manualPassId" placeholder="Enter Pass ID (e.g., LP-1234567890-ABC)"
                   style="width: 100%; padding: 0.875rem; background: var(--pure-black); border: 1px solid var(--border-dark); border-radius: 10px; color: #fff; font-size: 1rem; margin-bottom: 0.75rem;">
            <button onclick="validateManualPass()" style="width: 100%; padding: 0.875rem; background: var(--lightning-yellow); color: #000; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer;">
              Validate Pass
            </button>
          </div>

          <!-- Result Card (replaces camera when pass scanned) -->
          <div class="result-card" id="resultCard">
            <div class="result-status" id="resultStatus">VERIFIED</div>
            <div class="result-guest-name" id="resultGuestName">Guest Name</div>

            <!-- Ticket details row: {Type} × {Qty} · {Paid/Comp} -->
            <div class="result-ticket-row" id="resultTicketRow">
              <span class="result-pass-name" id="resultPassName">General Admission</span>
              <span class="result-qty" id="resultQty">× 7</span>
              <span class="result-ticket-divider">·</span>
              <span class="result-ticket-type" id="resultTicketType">Paid</span>
            </div>

            <!-- Event name -->
            <div class="result-event-name" id="resultEventName">Stars, Stripes & Sunsets</div>

            <!-- Re-entry warning (hidden by default) -->
            <div class="reentry-warning hidden" id="reentryWarning">
              <span class="reentry-icon">!</span>
              <span class="reentry-text" id="reentryText">Entered 2x tonight · last 11:40 PM</span>
            </div>

            <!-- Pass ID (small) -->
            <div class="result-pass-id" id="resultPassId">LP-1234567890-ABC</div>
          </div>
        </div>

        <!-- Age Result (shown after ID scan or manual selection) -->
        <div class="age-result hidden" id="ageResult" style="margin-bottom: 1rem;">
          <div class="age-result-title" id="ageResultTitle"></div>
          <div class="age-result-dob" id="ageResultDob"></div>
        </div>

        <!-- Manual Age Buttons (always visible after pass verified) -->
        <div class="id-check-section hidden" id="ageButtons">
          <p style="color: var(--gray); font-size: 0.85rem; margin-bottom: 0.75rem; text-align: center;">
            Age verification (or use ID Scan tab)
          </p>
          <div class="manual-buttons">
            <button class="manual-btn over21" onclick="setAgeManual(true)">21+</button>
            <button class="manual-btn under21" onclick="setAgeManual(false)">Under 21</button>
          </div>
        </div>

        <!-- Action Buttons (shown after valid pass) -->
        <div class="action-buttons hidden" id="actionButtons">
          <button class="btn-action btn-admit" id="btnAdmit" onclick="admitGuest()">ADMIT</button>
          <button class="btn-action btn-deny" onclick="denyEntry()">DENY</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // API Configuration
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000'
      : 'https://lightning-backend-production.up.railway.app';

    // Staff passcode (simple 4-digit code)
    const STAFF_CODE = '0704';

    // State
    let currentPass = null;
    let ageCheckPerformed = false;
    let ageOver21 = null;
    let qrScanner = null;        // zxing-wasm scanner state
    let qrStream = null;         // MediaStream for QR camera
    let qrAnimationId = null;    // requestAnimationFrame ID
    let idScanner = null;
    let idScanTimeout = null;
    let scannerMode = 'qr';
    let staffToken = null;
    let zxingReady = false;      // zxing-wasm initialization flag
    let lastScanTime = 0;        // Debounce scans

    // Passcode input handling
    const inputs = [
      document.getElementById('c1'),
      document.getElementById('c2'),
      document.getElementById('c3'),
      document.getElementById('c4')
    ];

    inputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        if (e.target.value && i < 3) inputs[i + 1].focus();
        if (getCode().length === 4) submitPasscode();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) inputs[i - 1].focus();
      });
    });

    function getCode() {
      return inputs.map(i => i.value).join('');
    }

    function submitPasscode() {
      const code = getCode();
      if (code.length !== 4) return;

      const btn = document.getElementById('passcodeBtn');
      const error = document.getElementById('passcodeError');
      btn.disabled = true;
      btn.textContent = 'Checking...';
      error.textContent = '';

      if (code === STAFF_CODE) {
        // Success - show app
        document.getElementById('passcodeOverlay').style.display = 'none';
        document.getElementById('mainApp').classList.remove('hidden');
        sessionStorage.setItem('staffAuthed', 'true');
        switchScannerMode('qr');
      } else {
        // Wrong code
        error.textContent = 'Invalid code. Try again.';
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
        btn.disabled = false;
        btn.textContent = 'Enter';
      }
    }

    function logout() {
      sessionStorage.removeItem('staffAuthed');
      window.location.reload();
    }

    async function apiCall(endpoint, options = {}) {
      // Use admin token if available, otherwise make unauthenticated call
      const token = localStorage.getItem('token');
      const headers = {
        'Content-Type': 'application/json',
        ...options.headers
      };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      const res = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    // Scanner mode
    async function switchScannerMode(mode) {
      scannerMode = mode;

      document.querySelectorAll('.scanner-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.mode === mode);
      });

      const qrViewport = document.getElementById('qrViewport');
      const idViewport = document.getElementById('idViewport');
      const manualEntry = document.getElementById('manualEntry');
      const resultCard = document.getElementById('resultCard');

      // Stop all scanners first
      await stopQRScanner();
      await stopIdScanner();

      // Hide result card when switching modes
      resultCard.classList.remove('show', 'verified', 'invalid', 'already-used');

      // Reset scan status
      setScanStatus('ready', 'Ready to scan');

      // Show/hide viewports and start appropriate scanner
      if (mode === 'qr') {
        qrViewport.classList.remove('hidden');
        idViewport.classList.add('hidden');
        manualEntry.classList.add('hidden');
        await startQRScanner();
      } else if (mode === 'id') {
        qrViewport.classList.add('hidden');
        idViewport.classList.remove('hidden');
        manualEntry.classList.add('hidden');
        await startIdScanner();
      } else {
        qrViewport.classList.add('hidden');
        idViewport.classList.add('hidden');
        manualEntry.classList.remove('hidden');
      }
    }

    // Update scan status indicator
    function setScanStatus(type, text) {
      const status = document.getElementById('scanStatus');
      const statusText = document.getElementById('scanStatusText');
      status.className = 'scan-status ' + type;
      statusText.textContent = text;
    }

    // QR Scanner using zxing-wasm (v3.1.0, tryHarder: true)
    async function startQRScanner() {
      if (qrStream) return; // Already running

      const qrReaderEl = document.getElementById('qr-reader');

      try {
        // Initialize zxing-wasm if not ready
        if (!zxingReady && typeof ZXingWASM !== 'undefined') {
          console.log('Initializing zxing-wasm...');
          zxingReady = true;
        }

        // Get camera stream (back camera, high res for better reads)
        qrStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        // Create video element
        let videoEl = qrReaderEl.querySelector('video');
        if (!videoEl) {
          videoEl = document.createElement('video');
          videoEl.style.width = '100%';
          videoEl.style.height = '100%';
          videoEl.style.objectFit = 'cover';
          videoEl.setAttribute('playsinline', '');
          videoEl.setAttribute('autoplay', '');
          videoEl.muted = true;
          qrReaderEl.appendChild(videoEl);
        }

        videoEl.srcObject = qrStream;
        await videoEl.play();

        // Create canvas for frame capture
        let canvas = qrReaderEl.querySelector('canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.style.display = 'none';
          qrReaderEl.appendChild(canvas);
        }

        document.getElementById('qrOverlay').style.display = 'none';
        qrScanner = { video: videoEl, canvas: canvas };

        // Start frame capture loop
        scanQRFrame();

      } catch (err) {
        console.error('QR Scanner error:', err);
        document.getElementById('qrOverlay').innerHTML = `
          <div style="text-align: center; color: var(--gray); padding: 2rem;">
            <p>Camera access required</p>
            <p style="font-size: 0.85rem; margin-top: 0.5rem;">Please allow camera permissions</p>
          </div>
        `;
      }
    }

    async function scanQRFrame() {
      if (!qrScanner || !qrStream) return;

      const { video, canvas } = qrScanner;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // Match canvas to video dimensions
      if (video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Draw current frame
        ctx.drawImage(video, 0, 0);

        // Get image data for zxing-wasm
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        try {
          // Use zxing-wasm to decode with tryHarder for degraded frames
          const results = await ZXingWASM.readBarcodesFromImageData(imageData, {
            formats: ['QRCode'],
            tryHarder: true,
            maxNumberOfSymbols: 1
          });

          if (results && results.length > 0 && results[0].text) {
            const now = Date.now();
            // Debounce: ignore if same code scanned within 2 seconds
            if (now - lastScanTime > 2000) {
              lastScanTime = now;
              console.log('zxing-wasm decoded:', results[0].text);
              await onQRCodeSuccess(results[0].text);
              return; // Don't continue scanning after success
            }
          }
        } catch (e) {
          // Decode failed - normal for most frames, continue scanning
        }
      }

      // Continue scanning
      qrAnimationId = requestAnimationFrame(scanQRFrame);
    }

    function stopQRScanner() {
      // Stop animation frame
      if (qrAnimationId) {
        cancelAnimationFrame(qrAnimationId);
        qrAnimationId = null;
      }

      // Stop media stream
      if (qrStream) {
        qrStream.getTracks().forEach(track => track.stop());
        qrStream = null;
      }

      // Clear video element
      if (qrScanner && qrScanner.video) {
        qrScanner.video.srcObject = null;
      }

      qrScanner = null;
    }

    async function onQRCodeSuccess(decodedText) {
      // Show processing status immediately
      setScanStatus('processing', 'QR Found - Verifying...');

      // Stop scanner (we use our own frame loop now)
      stopQRScanner();

      console.log('QR scanned:', decodedText);

      // Check if QR contains embedded JSON data (new format)
      if (decodedText.startsWith('{')) {
        try {
          const qrData = JSON.parse(decodedText);
          // New format: {i: passId, n: name, e: event, d: date, t: type, q: qty}
          const passId = qrData.i;
          const embeddedData = {
            passId: passId,
            guestName: qrData.n,
            eventName: qrData.e,
            eventDate: qrData.d,
            ticketType: qrData.t,
            quantity: qrData.q || 1
          };
          console.log('Embedded QR data:', embeddedData);
          await validatePassWithData(passId, embeddedData);
          return;
        } catch (e) {
          console.log('QR parse failed, treating as passId');
        }
      }

      // Legacy format: extract passId from URL or raw string
      let passId = decodedText;

      // Handle URL format - look for LP-xxx pattern
      if (decodedText.includes('/')) {
        const lpMatch = decodedText.match(/LP-[\w-]+/i);
        if (lpMatch) {
          passId = lpMatch[0];
        } else {
          const parts = decodedText.split('/');
          const viewIndex = parts.indexOf('view');
          if (viewIndex > 0) {
            passId = parts[viewIndex - 1];
          } else {
            passId = parts[parts.length - 1];
          }
        }
      }

      console.log('Extracted passId:', passId);
      await validatePass(passId);
    }

    async function validateManualPass() {
      const input = document.getElementById('manualPassId');
      const passId = input.value.trim();
      if (!passId) return;
      await validatePass(passId);
    }

    // Validate with embedded QR data (shows instant display, still checks backend)
    async function validatePassWithData(passId, embeddedData) {
      // Store embedded data immediately for display
      currentPass = {
        passId: passId,
        guestName: embeddedData.guestName,
        quantity: embeddedData.quantity || 1,
        ticketType: embeddedData.ticketType,
        eventName: embeddedData.eventName,
        eventDate: embeddedData.eventDate
      };

      // Show "verifying..." status briefly
      setScanStatus('processing', 'Verifying with server...');

      // Always verify with backend (for entry count, used/refunded checks)
      try {
        const res = await fetch(`${API_BASE}/api/v1/staff/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passId, code: STAFF_CODE })
        });
        const data = await res.json();

        // Update currentPass with backend data
        currentPass.eventId = data.eventId;
        currentPass.eventSlug = data.eventSlug;
        currentPass.passName = data.passName;

        if (!data.valid) {
          // Invalid - show error
          let resultType = data.reason === 'already_used' ? 'already-used' : 'invalid';
          showResult(resultType, data.guestName || embeddedData.guestName || 'Guest', data);
        } else {
          // Valid - show with full backend data (includes entryCount, lastEntry)
          showResult('verified', data.guestName, data);
          document.getElementById('ageButtons').classList.remove('hidden');
          document.getElementById('actionButtons').classList.remove('hidden');
        }
      } catch (err) {
        console.log('Backend validation failed, using embedded data:', err.message);
        // Fallback to embedded data if backend fails
        showResult('verified', embeddedData.guestName, embeddedData);
        document.getElementById('ageButtons').classList.remove('hidden');
        document.getElementById('actionButtons').classList.remove('hidden');
      }
    }

    async function validatePass(passId) {
      // Use the staff validate endpoint (passcode auth, no JWT needed)
      try {
        const res = await fetch(`${API_BASE}/api/v1/staff/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passId, code: STAFF_CODE })
        });

        const data = await res.json();

        // Store pass data for admit/deny
        currentPass = {
          passId: data.passId || passId,
          guestName: data.guestName,
          quantity: data.quantity || 1,
          eventId: data.eventId,
          eventSlug: data.eventSlug,
          ticketType: data.ticketType,
          isTeam: data.isTeam,
          isComp: data.isComp
        };

        // Check if pass is valid
        if (!data.valid) {
          let resultType = 'invalid';

          if (data.reason === 'already_used') {
            resultType = 'already-used';
          }

          showResult(resultType, data.guestName || 'Guest', data);
          return;
        }

        // Valid pass - show all details
        showResult('verified', data.guestName, data);

        // Show age buttons and action buttons
        document.getElementById('ageButtons').classList.remove('hidden');
        document.getElementById('actionButtons').classList.remove('hidden');

      } catch (err) {
        console.error('Validate error:', err);
        // Network error - show error state
        showResult('invalid', 'Connection Error', { error: 'Could not validate pass' });
      }
    }

    function showResult(type, guestName, data = null) {
      const qrViewport = document.getElementById('qrViewport');
      const resultCard = document.getElementById('resultCard');

      // Hide camera viewport, show result card
      qrViewport.classList.add('hidden');
      resultCard.className = 'result-card show ' + type;

      // Set status badge
      const statusEl = document.getElementById('resultStatus');
      if (type === 'verified') {
        statusEl.textContent = 'VERIFIED';
      } else if (type === 'already-used') {
        statusEl.textContent = 'ALREADY USED';
      } else {
        statusEl.textContent = 'INVALID';
      }

      // Set guest name (large)
      document.getElementById('resultGuestName').textContent = guestName || 'Unknown Guest';

      // Set pass name (General Admission, VIP, etc.)
      const passName = data?.passName || 'General Admission';
      document.getElementById('resultPassName').textContent = passName;

      // Set quantity (crucial for multi-person passes like GA × 7 or Cabana × 6)
      const qty = data?.quantity || currentPass?.quantity || 1;
      const qtyEl = document.getElementById('resultQty');
      qtyEl.textContent = `× ${qty}`;
      // Hide quantity display if just 1
      qtyEl.style.display = qty > 1 ? 'inline' : 'none';

      // Determine ticket type display (Paid/Comp/Team)
      let displayType = 'Paid';
      let typeClass = 'paid';
      const backendType = data?.ticketType?.toLowerCase() || '';

      if (backendType === 'team' || data?.isTeam) {
        displayType = 'Team';
        typeClass = 'team';
      } else if (backendType === 'comp' || data?.isComp) {
        displayType = 'Comp';
        typeClass = 'comp';
      } else if (backendType === 'paid' || data?.amount > 0) {
        displayType = 'Paid';
        typeClass = 'paid';
      }

      const ticketTypeEl = document.getElementById('resultTicketType');
      ticketTypeEl.textContent = displayType;
      ticketTypeEl.className = 'result-ticket-type ' + typeClass;

      // Set event name
      const eventName = data?.eventName || 'Event';
      document.getElementById('resultEventName').textContent = eventName;

      // Handle re-entry warning
      const reentryWarning = document.getElementById('reentryWarning');
      const entryCount = data?.entryCount || 0;
      const lastEntry = data?.lastEntry;

      if (entryCount > 0 && type === 'verified') {
        // Format last entry time
        let lastTimeStr = '';
        if (lastEntry) {
          const lastDate = new Date(lastEntry);
          lastTimeStr = lastDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        reentryWarning.classList.remove('hidden');
        if (entryCount === 1) {
          document.getElementById('reentryText').textContent = `Entered once · ${lastTimeStr}`;
        } else {
          document.getElementById('reentryText').textContent = `Entered ${entryCount}x tonight · last ${lastTimeStr}`;
        }
      } else {
        reentryWarning.classList.add('hidden');
      }

      // Set pass ID (small, at bottom)
      const passId = currentPass?.passId || data?.passId || '';
      document.getElementById('resultPassId').textContent = passId;

      // Hide action buttons for truly invalid passes (refunded, expired)
      if (type !== 'verified') {
        document.getElementById('ageButtons').classList.add('hidden');
        document.getElementById('actionButtons').classList.add('hidden');

        // Resume scanner after delay
        setTimeout(async () => {
          await resetScanState();
          await switchScannerMode('qr');
        }, 3000);
      }
    }

    // ID Vision Service URL (separate Railway service for heavy processing)
    // Phone captures frame -> POST base64 -> server decodes + returns age flags
    const ID_VISION_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3001'
      : 'https://id-vision-service-production.up.railway.app';

    // ID Scanner for PDF417 barcodes (driver's license)
    // Hybrid mode: tries server-side vision service first, falls back to local zxing-wasm
    let idStream = null;
    let idAnimationId = null;
    let idFrameCount = 0;  // Track frames sent to server
    let idServerPending = false;  // Prevent concurrent server calls
    let idProgressInterval = null;  // Progress indicator timer
    let idScanStartTime = null;  // Track scan duration
    const ID_SCAN_TIMEOUT_MS = 25000;  // 25 seconds before manual fallback

    async function startIdScanner() {
      if (idStream) return;

      const idReaderEl = document.getElementById('id-reader');
      idFrameCount = 0;
      idServerPending = false;

      try {
        // Get camera stream (back camera, high res for barcode detail)
        idStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        // Create video element
        let videoEl = idReaderEl.querySelector('video');
        if (!videoEl) {
          videoEl = document.createElement('video');
          videoEl.style.width = '100%';
          videoEl.style.height = '100%';
          videoEl.style.objectFit = 'cover';
          videoEl.setAttribute('playsinline', '');
          videoEl.setAttribute('autoplay', '');
          videoEl.muted = true;
          idReaderEl.appendChild(videoEl);
        }

        videoEl.srcObject = idStream;
        await videoEl.play();

        // Create canvas for frame capture
        let canvas = idReaderEl.querySelector('canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.style.display = 'none';
          idReaderEl.appendChild(canvas);
        }

        idScanner = { video: videoEl, canvas: canvas };

        // Start frame capture loop
        scanIdFrame();

        // Start progress indicator
        idScanStartTime = Date.now();
        updateIdScanProgress();
        idProgressInterval = setInterval(updateIdScanProgress, 1000);

        // Set timeout for manual fallback (25 seconds - give it time)
        idScanTimeout = setTimeout(() => {
          showIdManualFallback();
        }, ID_SCAN_TIMEOUT_MS);

      } catch (err) {
        console.error('ID Scanner error:', err);
        showIdManualFallback();
      }
    }

    // Update the ID scan progress indicator
    function updateIdScanProgress() {
      if (!idScanStartTime) return;

      const elapsed = Math.floor((Date.now() - idScanStartTime) / 1000);
      const remaining = Math.max(0, Math.floor(ID_SCAN_TIMEOUT_MS / 1000) - elapsed);
      const overlay = document.getElementById('idOverlay');

      if (elapsed < 8) {
        // First 8 seconds: "Scanning..."
        overlay.innerHTML = `
          <div style="text-align: center; padding: 1rem;">
            <svg viewBox="0 0 100 30" fill="none" stroke="var(--electric-blue)" stroke-width="1.5" style="width: 80%; max-width: 200px;">
              <rect x="5" y="5" width="90" height="20" rx="2" stroke-dasharray="5 3"/>
            </svg>
            <p style="color: var(--electric-blue); font-weight: 600; font-size: 1rem; margin-top: 0.5rem;">Scanning barcode...</p>
            <p style="color: var(--gray); font-size: 0.8rem; margin-top: 0.25rem;">Hold steady · ${remaining}s</p>
          </div>
        `;
      } else if (elapsed < 18) {
        // 8-18 seconds: "Still trying..."
        overlay.innerHTML = `
          <div style="text-align: center; padding: 1rem;">
            <svg viewBox="0 0 100 30" fill="none" stroke="#ff8c00" stroke-width="1.5" style="width: 80%; max-width: 200px;">
              <rect x="5" y="5" width="90" height="20" rx="2" stroke-dasharray="5 3"/>
            </svg>
            <p style="color: #ff8c00; font-weight: 600; font-size: 1rem; margin-top: 0.5rem;">Still scanning...</p>
            <p style="color: var(--gray); font-size: 0.8rem; margin-top: 0.25rem;">Try adjusting angle · ${remaining}s</p>
          </div>
        `;
      } else {
        // 18+ seconds: "Almost done..."
        overlay.innerHTML = `
          <div style="text-align: center; padding: 1rem;">
            <svg viewBox="0 0 100 30" fill="none" stroke="#ff8c00" stroke-width="1.5" style="width: 80%; max-width: 200px;">
              <rect x="5" y="5" width="90" height="20" rx="2" stroke-dasharray="5 3"/>
            </svg>
            <p style="color: #ff8c00; font-weight: 600; font-size: 1rem; margin-top: 0.5rem;">Trying harder...</p>
            <p style="color: var(--gray); font-size: 0.8rem; margin-top: 0.25rem;">Move closer if possible · ${remaining}s</p>
          </div>
        `;
      }
    }

    async function scanIdFrame() {
      if (!idScanner || !idStream) return;

      const { video, canvas } = idScanner;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      if (video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        // Send frame to server every 10 frames (reduce network load)
        // Server handles heavy processing: super-resolution + barcode decode + AAMVA parse
        idFrameCount++;

        if (idFrameCount % 10 === 0 && !idServerPending) {
          // Capture as JPEG for smaller payload
          const base64Image = canvas.toDataURL('image/jpeg', 0.85);

          // POST to vision service (non-blocking)
          sendFrameToVisionService(base64Image);
        }

        // Also try local zxing-wasm decode (fallback / parallel)
        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const results = await ZXingWASM.readBarcodesFromImageData(imageData, {
            formats: ['PDF417', 'DataMatrix', 'Code128'],
            tryHarder: true,
            maxNumberOfSymbols: 1
          });

          if (results && results.length > 0 && results[0].text) {
            console.log('[ID] Local zxing-wasm decoded:', results[0].text.substring(0, 50) + '...');
            await onIdScanSuccessLocal(results[0].text);
            return;
          }
        } catch (e) {
          // Local decode failed - continue (server may succeed)
        }
      }

      idAnimationId = requestAnimationFrame(scanIdFrame);
    }

    // Send frame to vision service for server-side processing
    async function sendFrameToVisionService(base64Image) {
      if (idServerPending) return;
      idServerPending = true;

      try {
        console.log('[ID-VISION] Sending frame to server...');

        const response = await fetch(`${ID_VISION_URL}/id-vision/scan`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });

        const data = await response.json();
        console.log('[ID-VISION] Server response:', data);

        // Server returns { valid, over21, confidence }
        if (data.valid && data.confidence === 'high') {
          // Stop scanner - we have a confident result from server
          if (idScanTimeout) {
            clearTimeout(idScanTimeout);
            idScanTimeout = null;
          }
          await stopIdScanner();

          ageCheckPerformed = true;
          ageOver21 = data.over21;

          // Show age result
          const ageResult = document.getElementById('ageResult');
          ageResult.classList.remove('hidden', 'over21', 'under21');
          ageResult.classList.add(data.over21 ? 'over21' : 'under21');
          document.getElementById('ageResultTitle').textContent = data.over21 ? '21+ VERIFIED' : 'UNDER 21';
          document.getElementById('ageResultDob').textContent = 'Server-verified (high confidence)';

          // Switch back to QR mode
          setTimeout(() => switchScannerMode('qr'), 1500);
          return;
        }

        // Not valid or low confidence - continue scanning
        // Server returns valid:false for garbage/unreadable images (FAIL-SAFE)

      } catch (err) {
        console.log('[ID-VISION] Server error (falling back to local):', err.message);
        // Server unreachable - continue with local scanning
      } finally {
        idServerPending = false;
      }
    }

    // Local zxing-wasm decode success (fallback path)
    async function onIdScanSuccessLocal(decodedText) {
      console.log('[ID] Local barcode decoded:', decodedText.substring(0, 50) + '...');

      // Stop scanner and clear timeout
      if (idScanTimeout) {
        clearTimeout(idScanTimeout);
        idScanTimeout = null;
      }
      await stopIdScanner();

      // Parse AAMVA locally (FAIL-SAFE: returns null if ANY ambiguity)
      try {
        const ageInfo = parseAAMVA(decodedText);

        if (ageInfo.dob && ageInfo.confidence === 'high') {
          const age = calculateAge(ageInfo.dob);
          const isOver21 = age >= 21;

          ageCheckPerformed = true;
          ageOver21 = isOver21;

          const ageResult = document.getElementById('ageResult');
          ageResult.classList.remove('hidden', 'over21', 'under21');
          ageResult.classList.add(isOver21 ? 'over21' : 'under21');
          document.getElementById('ageResultTitle').textContent = isOver21 ? '21+ VERIFIED' : 'UNDER 21';
          document.getElementById('ageResultDob').textContent = `DOB: ${formatDate(ageInfo.dob)} (Age ${age})`;

          setTimeout(() => switchScannerMode('qr'), 1500);
        } else {
          showIdManualFallback();
        }
      } catch (e) {
        console.error('AAMVA parse error:', e);
        showIdManualFallback();
      }
    }

    async function stopIdScanner() {
      if (idScanTimeout) {
        clearTimeout(idScanTimeout);
        idScanTimeout = null;
      }

      if (idProgressInterval) {
        clearInterval(idProgressInterval);
        idProgressInterval = null;
      }

      idScanStartTime = null;

      if (idAnimationId) {
        cancelAnimationFrame(idAnimationId);
        idAnimationId = null;
      }

      if (idStream) {
        idStream.getTracks().forEach(track => track.stop());
        idStream = null;
      }

      if (idScanner && idScanner.video) {
        idScanner.video.srcObject = null;
      }

      idScanner = null;
    }

    function showIdManualFallback() {
      // FAIL SAFE: ID scan failed/timed out/ambiguous - require manual verification
      // NEVER show a guessed age - only confident reads or manual verification
      stopIdScanner();
      const overlay = document.getElementById('idOverlay');
      overlay.innerHTML = `
        <div style="text-align: center; padding: 1.5rem;">
          <p style="color: #ff8c00; font-weight: 700; font-size: 1.3rem;">CHECK ID VISUALLY</p>
          <p style="color: var(--gray); font-size: 0.9rem; margin-top: 0.5rem;">Barcode couldn't be read</p>
          <div style="margin-top: 1rem; padding: 0.75rem; background: rgba(255,140,0,0.1); border-radius: 8px; border: 1px solid rgba(255,140,0,0.3);">
            <p style="color: #fff; font-size: 0.85rem;">Look at the birthdate on the ID<br>then tap <strong>21+</strong> or <strong>Under 21</strong> below</p>
          </div>
          <button onclick="retryIdScan()" style="margin-top: 1rem; padding: 0.6rem 1.5rem; background: var(--electric-blue); color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;">
            Try Again
          </button>
        </div>
      `;
    }

    function retryIdScan() {
      // Reset the overlay to default state
      const overlay = document.getElementById('idOverlay');
      overlay.innerHTML = `
        <svg viewBox="0 0 100 30" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="5" y="5" width="90" height="20" rx="2" stroke-dasharray="5 3"/>
        </svg>
      `;
      // Restart the scanner
      startIdScanner();
    }

    // Legacy function - now redirects to onIdScanSuccessLocal
    async function onIdScanSuccess(decodedText) {
      await onIdScanSuccessLocal(decodedText);
    }

    // FAIL-SAFE AAMVA PDF417 parser
    // Principle: If ANY ambiguity, return null. A wrong "21+ VERIFIED" is worse than "verify manually".
    // Only returns DOB if we have HIGH confidence the parse is correct.
    function parseAAMVA(data) {
      const result = { dob: null, confidence: 'none' };

      // 1. Validate this looks like AAMVA data (has expected structure)
      // AAMVA barcodes start with @ or contain ANSI header, and have field markers like DCS, DAC, DBB
      const hasAAMVAStructure = (
        (data.includes('@') || data.includes('ANSI ') || data.includes('AAMVA')) &&
        (data.includes('DCS') || data.includes('DAC') || data.includes('DBB'))
      );

      if (!hasAAMVAStructure) {
        console.log('AAMVA: Data does not match expected structure - failing safe');
        return result;
      }

      // 2. Extract DBB (Date of Birth) field - this is the standard AAMVA field
      const dobMatch = data.match(/DBB(\d{8})/);
      if (!dobMatch) {
        console.log('AAMVA: No DBB field found - failing safe');
        return result;
      }

      const dobStr = dobMatch[1];

      // 3. Determine date format with NO GUESSING
      // MMDDYYYY: first 2 digits 01-12 (month), next 2 digits 01-31 (day), last 4 digits year
      // YYYYMMDD: first 4 digits year (19xx or 20xx), next 2 digits 01-12, last 2 digits 01-31

      const first2 = parseInt(dobStr.substring(0, 2));
      const first4 = parseInt(dobStr.substring(0, 4));
      const mid2 = parseInt(dobStr.substring(2, 4));
      const mid2Alt = parseInt(dobStr.substring(4, 6));
      const last4 = parseInt(dobStr.substring(4, 8));
      const last2 = parseInt(dobStr.substring(6, 8));

      let year, month, day, format;

      // Check if it's unambiguously YYYYMMDD (year starts with 19 or 20)
      if (first4 >= 1930 && first4 <= 2010 && mid2Alt >= 1 && mid2Alt <= 12 && last2 >= 1 && last2 <= 31) {
        format = 'YYYYMMDD';
        year = first4;
        month = mid2Alt;
        day = last2;
      }
      // Check if it's unambiguously MMDDYYYY (first 2 is valid month, last 4 is valid year)
      else if (first2 >= 1 && first2 <= 12 && mid2 >= 1 && mid2 <= 31 && last4 >= 1930 && last4 <= 2010) {
        format = 'MMDDYYYY';
        month = first2;
        day = mid2;
        year = last4;
      }
      // AMBIGUOUS - both interpretations could be valid, FAIL SAFE
      else {
        console.log('AAMVA: Ambiguous date format - failing safe. Raw:', dobStr);
        return result;
      }

      // 4. Validate the parsed date is realistic for a bar patron
      // - Year: 1930-2010 (age 16-96 in 2026)
      // - Month: 1-12
      // - Day: 1-31 (we already checked this)
      // - Also validate the day is valid for the month (no Feb 30)
      const daysInMonth = new Date(year, month, 0).getDate();
      if (day > daysInMonth) {
        console.log(`AAMVA: Invalid day ${day} for month ${month} - failing safe`);
        return result;
      }

      // 5. Create the date and verify it's not in the future
      const dob = new Date(year, month - 1, day);
      const today = new Date();
      if (dob > today) {
        console.log('AAMVA: DOB is in the future - failing safe');
        return result;
      }

      // 6. Calculate age and sanity check (must be at least 16 to have a license)
      const age = calculateAge(dob);
      if (age < 16 || age > 100) {
        console.log(`AAMVA: Unrealistic age ${age} - failing safe`);
        return result;
      }

      // SUCCESS - we have high confidence in this parse
      console.log(`AAMVA: Parsed ${format} format -> ${month}/${day}/${year} (Age ${age})`);
      result.dob = dob;
      result.confidence = 'high';
      return result;
    }

    function calculateAge(dob) {
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const monthDiff = today.getMonth() - dob.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
        age--;
      }
      return age;
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function setAgeManual(over21) {
      ageCheckPerformed = true;
      ageOver21 = over21;

      // Stop ID scanner if running
      stopIdScanner();

      // Show age result
      const ageResult = document.getElementById('ageResult');
      ageResult.classList.remove('hidden', 'over21', 'under21');
      ageResult.classList.add(over21 ? 'over21' : 'under21');
      document.getElementById('ageResultTitle').textContent = over21 ? '21+ VERIFIED' : 'UNDER 21';
      document.getElementById('ageResultDob').textContent = 'Manual verification';
    }

    // Track admitted count locally
    let localAdmittedCount = 0;

    // Admit guest - allows unlimited re-entries, logs each scan
    async function admitGuest() {
      if (!currentPass) return;

      const btnAdmit = document.getElementById('btnAdmit');
      btnAdmit.disabled = true;
      btnAdmit.textContent = 'Processing...';

      try {
        // Use passcode-authenticated admit endpoint (allows re-entry)
        const response = await fetch(`${API_BASE}/api/v1/staff/admit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            passId: currentPass.passId,
            code: STAFF_CODE,
            ageCheckPerformed,
            ageOver21: ageCheckPerformed ? ageOver21 : undefined
          })
        });

        const data = await response.json();

        if (!response.ok) {
          console.error('Admit API error:', data.error);
          showAdmitError(data.error || 'Admit failed');
          return;
        }

        // Update local count
        localAdmittedCount += (currentPass.quantity || 1);
        document.getElementById('entryCount').textContent = `${localAdmittedCount} Admitted`;

        // Show ADMITTED confirmation
        showAdmitSuccess(data.entryCount || 1);

      } catch (err) {
        console.error('Admit error:', err);
        // Network error - still show local success
        localAdmittedCount += (currentPass.quantity || 1);
        document.getElementById('entryCount').textContent = `${localAdmittedCount} Admitted`;
        showAdmitSuccess(null);
      }
    }

    function showAdmitSuccess(entryCount) {
      const resultCard = document.getElementById('resultCard');
      resultCard.className = 'result-card show verified';

      // Change status to ADMITTED
      const statusEl = document.getElementById('resultStatus');
      statusEl.textContent = 'ADMITTED';

      // Hide action buttons
      document.getElementById('ageButtons').classList.add('hidden');
      document.getElementById('actionButtons').classList.add('hidden');

      // Update re-entry info if this was a re-entry
      if (entryCount && entryCount > 1) {
        const reentryWarning = document.getElementById('reentryWarning');
        reentryWarning.classList.remove('hidden');
        document.getElementById('reentryText').textContent = `Entry #${entryCount} recorded`;
      }

      // Reset after delay and restart scanner
      setTimeout(async () => {
        await resetScanState();
        await switchScannerMode('qr');
      }, 1500);
    }

    function showAdmitError(errorMsg) {
      const resultCard = document.getElementById('resultCard');
      resultCard.className = 'result-card show invalid';

      const statusEl = document.getElementById('resultStatus');
      statusEl.textContent = 'ERROR';

      document.getElementById('resultEventName').textContent = errorMsg;

      // Hide action buttons
      document.getElementById('ageButtons').classList.add('hidden');
      document.getElementById('actionButtons').classList.add('hidden');

      // Reset admit button
      const btnAdmit = document.getElementById('btnAdmit');
      btnAdmit.disabled = false;
      btnAdmit.textContent = 'ADMIT';

      // Reset after delay
      setTimeout(async () => {
        await resetScanState();
        await switchScannerMode('qr');
      }, 3000);
    }

    async function denyEntry() {
      if (!currentPass) return;

      // Show denial UI immediately
      showResult('invalid', 'Entry denied', {
        guestName: currentPass.guestName,
        ticketType: currentPass.ticketType
      });

      // Optional: Log the denial via JWT-authenticated endpoint if available
      const token = localStorage.getItem('token');
      if (token && currentPass.eventId) {
        try {
          await apiCall('/api/v1/staff/entry', {
            method: 'POST',
            body: JSON.stringify({
              passId: currentPass.passId,
              eventId: currentPass.eventId,
              eventSlug: currentPass.eventSlug,
              result: 'invalid',
              ageCheckPerformed,
              ageOver21: ageCheckPerformed ? ageOver21 : undefined,
              guestName: currentPass.guestName,
              passType: currentPass.ticketType,
              quantity: currentPass.quantity || 1
            })
          });
        } catch (e) {
          console.log('Deny log API failed (non-critical):', e.message);
        }
      }

      setTimeout(async () => {
        await resetScanState();
        await switchScannerMode('qr');
      }, 1500);
    }

    async function resetScanState() {
      currentPass = null;
      ageCheckPerformed = false;
      ageOver21 = null;

      // Stop all scanners
      await stopQRScanner();
      await stopIdScanner();

      // Hide result card, show QR viewport
      document.getElementById('resultCard').classList.remove('show', 'verified', 'invalid', 'already-used');
      document.getElementById('qrViewport').classList.remove('hidden');

      // Reset scan status
      setScanStatus('ready', 'Ready to scan');

      // Hide action UI
      document.getElementById('ageButtons').classList.add('hidden');
      document.getElementById('actionButtons').classList.add('hidden');
      document.getElementById('ageResult').classList.add('hidden');
      document.getElementById('manualPassId').value = '';

      // Reset ID overlay to default state
      document.getElementById('idOverlay').innerHTML = `
        <svg viewBox="0 0 100 30" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="5" y="5" width="90" height="20" rx="2" stroke-dasharray="5 3"/>
        </svg>
      `;

      // Reset admit button
      const btnAdmit = document.getElementById('btnAdmit');
      btnAdmit.disabled = false;
      btnAdmit.textContent = 'ADMIT';
    }

    // Init
    function init() {
      // Check if already authed this session
      if (sessionStorage.getItem('staffAuthed') === 'true') {
        document.getElementById('passcodeOverlay').style.display = 'none';
        document.getElementById('mainApp').classList.remove('hidden');
        // Door staff doesn't need to load events - they validate individual passes
        switchScannerMode('qr');
      } else {
        // Focus first input
        inputs[0].focus();

        // Check for code in URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlCode = urlParams.get('code');
        if (urlCode && urlCode.length === 4) {
          urlCode.split('').forEach((c, i) => inputs[i].value = c);
          submitPasscode();
        }
      }
    }

    init();
  </script>
</body>
