<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Request a Song - Lightning Pass</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ffd700' d='M55 5L15 55h25L30 95l50-55H55L70 5z'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#000;--card:#111;--border:#222;--yellow:#ffdd00;--purple:#9d4edd;--green:#39ff14;--white:#fff;--gray:#888}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;padding:20px 20px 100px}
        .container{max-width:480px;margin:0 auto}
        .header{text-align:center;margin-bottom:30px}
        .logo{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--yellow),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
        .dj-name{font-size:20px;font-weight:600;margin-bottom:5px}
        .dj-bio{font-size:14px;color:var(--gray)}
        .loading{text-align:center;padding:60px 20px}
        .spinner{width:50px;height:50px;border:3px solid var(--border);border-top-color:var(--yellow);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .form-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
        .section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
        .form-group input,.form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:16px;color:var(--white);font-family:inherit}
        .form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--yellow)}
        .form-group textarea{resize:none;height:80px}
        .bolt-tiers{display:grid;gap:12px}
        .bolt-tier{background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all 0.2s}
        .bolt-tier:hover,.bolt-tier.selected{border-color:var(--yellow);background:rgba(255,221,0,0.1)}
        .bolt-tier .tier-name{font-weight:700;font-size:15px}
        .bolt-tier .tier-desc{font-size:12px;color:var(--gray)}
        .bolt-tier .tier-price{font-weight:800;font-size:18px;color:var(--yellow)}
        .bolt-tier.play-now{border-color:var(--purple)}
        .bolt-tier.play-now.selected{background:rgba(157,78,221,0.1);border-color:var(--purple)}
        .bolt-tier.play-now .tier-price{color:var(--purple)}
        .tip-buttons{display:flex;gap:10px;flex-wrap:wrap}
        .tip-btn{flex:1;min-width:60px;padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--white);font-size:15px;font-weight:600;cursor:pointer}
        .tip-btn.selected{border-color:var(--green);background:rgba(57,255,20,0.1);color:var(--green)}
        .summary{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
        .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
        .summary-row.total{border-top:1px solid var(--border);margin-top:10px;padding-top:16px;font-size:18px;font-weight:700}
        .summary-row.total .amount{color:var(--yellow)}
        .submit-btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--yellow),#ff8c00);border:none;border-radius:12px;color:#000;font-size:18px;font-weight:700;cursor:pointer}
        .submit-btn:disabled{opacity:0.5;cursor:not-allowed}
        .error-message{background:rgba(255,0,68,0.1);border:1px solid rgba(255,0,68,0.3);border-radius:10px;padding:16px;margin-bottom:20px;color:#ff4466;text-align:center}
        .success-screen{text-align:center;padding:60px 20px}
        .success-icon{font-size:80px;margin-bottom:20px}
        .success-title{font-size:28px;font-weight:800;margin-bottom:10px;background:linear-gradient(135deg,var(--yellow),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .success-message{color:var(--gray);font-size:16px;margin-bottom:30px}
        .not-found{text-align:center;padding:60px 20px}
        .not-found h2{font-size:24px;margin-bottom:10px}
        .not-found p{color:var(--gray)}
        /* Light theme for selector and empty state */
        .selector-view{background:#fff;min-height:100vh;margin:-20px;padding:20px 20px 100px}
        .selector-view .logo{color:#1a1a2e;background:none;-webkit-text-fill-color:#1a1a2e}
        .selector-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#ffd700;margin-bottom:20px}
        .dj-card{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px}
        .dj-card-name{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
        .dj-card-venue{font-size:14px;color:#6b7280;margin-bottom:8px}
        .dj-card-fee{font-size:13px;color:#6b7280;margin-bottom:16px}
        .dj-card-btn{display:block;width:100%;padding:14px;background:#ffd700;border:none;border-radius:10px;color:#1a1a2e;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
        .dj-card-btn:hover{background:#e6c200}
        .empty-state{text-align:center;padding:80px 20px}
        .empty-state-icon{font-size:64px;margin-bottom:20px;opacity:0.5}
        .empty-state h2{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:12px}
        .empty-state p{color:#6b7280;font-size:15px;margin-bottom:24px;line-height:1.5}
        .empty-state-btn{display:inline-block;padding:14px 28px;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:10px;color:#1a1a2e;font-size:14px;font-weight:600;text-decoration:none}
        .empty-state-btn:hover{background:#e5e7eb}
    </style>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚡ Lightning Pass</div>
            <div class="dj-name" id="djName">Loading...</div>
            <div class="dj-bio" id="djBio"></div>
        </div>
        <div id="content">
            <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
        </div>
    </div>
    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000' : 'https://lightning-backend-production.up.railway.app';
        const API=`${API_BASE}/api/v1/lightning`;
        const djId=window.location.pathname.split('/').pop();
        let baseFee=500,selectedBolt=null,selectedTip=0;
        const BOLTS={next_5:{label:'Next 5',price:300},next_up:{label:'Next Up',price:1000},play_now:{label:'Play Now',price:2500}};

        async function init(){
            // If no DJ ID (path is /dj or /dj/), show selector or empty state
            if(!djId||djId==='dj'){
                await showSelectorOrEmpty();
                return;
            }
            // Otherwise, load specific DJ's request form
            try{
                // Fetch Stripe key from config
                const configRes=await fetch(`${API}/config`);
                const configData=await configRes.json();
                STRIPE_KEY=configData.stripePublishableKey;
                if(!STRIPE_KEY){console.error('Stripe key not configured');showEmptyState();return}

                const r=await fetch(`${API}/dj/${djId}/public`);
                if(!r.ok){showEmptyState();return}
                const d=await r.json();
                if(!d.success){showEmptyState();return}
                document.getElementById('djName').textContent=d.dj.name;
                document.getElementById('djBio').textContent=d.dj.bio||'Request your favorite songs!';
                baseFee=d.dj.baseFee||500;
                showForm();
            }catch(e){showEmptyState()}
        }

        async function showSelectorOrEmpty(){
            try{
                const r=await fetch(`${API}/dj/active`);
                const d=await r.json();
                if(d.success && d.activeDJs && d.activeDJs.length > 0){
                    showSelector(d.activeDJs);
                }else{
                    showEmptyState();
                }
            }catch(e){
                console.error('Failed to fetch active DJs:', e);
                showEmptyState();
            }
        }

        function showSelector(djs){
            document.body.innerHTML=`
                <div class="selector-view">
                    <div class="container">
                        <div class="header">
                            <div class="logo">Lightning Pass</div>
                        </div>
                        <div class="selector-title">LIVE NOW</div>
                        <div id="djList"></div>
                    </div>
                </div>`;
            const list=document.getElementById('djList');
            djs.forEach(dj=>{
                const feeDisplay=(dj.baseFee/100).toFixed(0);
                const venueText=dj.venue?`@ ${dj.venue.name}`:'';
                list.innerHTML+=`
                    <div class="dj-card">
                        <div class="dj-card-name">${escapeHtml(dj.name)}</div>
                        ${venueText?`<div class="dj-card-venue">${escapeHtml(venueText)}</div>`:''}
                        <div class="dj-card-fee">Base request: $${feeDisplay}</div>
                        <a href="/dj/${dj._id}" class="dj-card-btn">Request a Song</a>
                    </div>`;
            });
        }

        function showEmptyState(){
            document.body.innerHTML=`
                <div class="selector-view">
                    <div class="container">
                        <div class="header">
                            <div class="logo">Lightning Pass</div>
                        </div>
                        <div class="empty-state">
                            <div class="empty-state-icon">🎵</div>
                            <h2>No live DJ right now</h2>
                            <p>Song requests open during live events.<br>Check back when the party starts!</p>
                            <a href="/members" class="empty-state-btn">Back to Dashboard</a>
                        </div>
                    </div>
                </div>`;
        }

        function escapeHtml(str){
            const div=document.createElement('div');
            div.textContent=str;
            return div.innerHTML;
        }

        function showForm(){
            document.getElementById('content').innerHTML=`
                <form id="form" onsubmit="handleSubmit(event)">
                    <div class="form-section">
                        <div class="section-title">🎵 Song Request</div>
                        <div class="form-group"><label>Song Title *</label><input type="text" id="song" required placeholder="Enter song name"></div>
                        <div class="form-group"><label>Artist</label><input type="text" id="artist" placeholder="Artist name"></div>
                        <div class="form-group"><label>Message</label><textarea id="comment" placeholder="Special requests..."></textarea></div>
                    </div>
                    <div class="form-section">
                        <div class="section-title">⚡ Priority</div>
                        <div class="bolt-tiers">
                            <div class="bolt-tier selected" onclick="setBolt(null)"><div><div class="tier-name">Standard</div><div class="tier-desc">Added to queue</div></div><span class="tier-price">$${(baseFee/100).toFixed(2)}</span></div>
                            <div class="bolt-tier" data-t="next_5" onclick="setBolt('next_5')"><div><div class="tier-name">⚡ Next 5</div><div class="tier-desc">Within 5 songs</div></div><span class="tier-price">+$3</span></div>
                            <div class="bolt-tier" data-t="next_up" onclick="setBolt('next_up')"><div><div class="tier-name">⚡⚡ Next Up</div><div class="tier-desc">Play next</div></div><span class="tier-price">+$10</span></div>
                            <div class="bolt-tier play-now" data-t="play_now" onclick="setBolt('play_now')"><div><div class="tier-name">🔥 PLAY NOW</div><div class="tier-desc">Immediate</div></div><span class="tier-price">+$25</span></div>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="section-title">💚 Tip DJ</div>
                        <div class="tip-buttons">
                            <button type="button" class="tip-btn selected" onclick="setTip(0,this)">None</button>
                            <button type="button" class="tip-btn" onclick="setTip(200,this)">$2</button>
                            <button type="button" class="tip-btn" onclick="setTip(500,this)">$5</button>
                            <button type="button" class="tip-btn" onclick="setTip(1000,this)">$10</button>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="section-title">📧 Your Info</div>
                        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="your@email.com"></div>
                        <div class="form-group"><label>Name</label><input type="text" id="name" placeholder="Your name"></div>
                    </div>
                    <div class="form-section">
                        <div class="section-title">💳 Payment</div>
                        <div id="card-element" style="background: white; padding: 14px 16px; border-radius: 10px;"></div>
                        <div id="card-errors" style="color: #ff4466; font-size: 13px; margin-top: 8px;"></div>
                    </div>
                    <div class="summary">
                        <div class="summary-row"><span>Base</span><span id="sBase">$${(baseFee/100).toFixed(2)}</span></div>
                        <div class="summary-row" id="sBoltRow" style="display:none"><span id="sBoltL">Priority</span><span id="sBolt"></span></div>
                        <div class="summary-row" id="sTipRow" style="display:none"><span>Tip</span><span id="sTip"></span></div>
                        <div class="summary-row total"><span>Total</span><span class="amount" id="sTotal">$${(baseFee/100).toFixed(2)}</span></div>
                    </div>
                    <div id="error" class="error-message" style="display:none"></div>
                    <button type="submit" class="submit-btn" id="btn">⚡ Pay $${(baseFee/100).toFixed(2)}</button>
                </form>`;

            // Initialize Stripe and mount card element
            if (STRIPE_KEY) {
                stripe = Stripe(STRIPE_KEY);
                const elements = stripe.elements();
                cardElement = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '16px',
                            color: '#1a1a2e',
                            '::placeholder': { color: '#aab7c4' }
                        },
                        invalid: { color: '#ff4466' }
                    }
                });
                cardElement.mount('#card-element');
                cardElement.on('change', (e) => {
                    const errDiv = document.getElementById('card-errors');
                    errDiv.textContent = e.error ? e.error.message : '';
                });
            }
        }

        function setBolt(t){
            selectedBolt=t;
            document.querySelectorAll('.bolt-tier').forEach(e=>e.classList.remove('selected'));
            (t?document.querySelector(`[data-t="${t}"]`):document.querySelector('.bolt-tier')).classList.add('selected');
            update();
        }

        function setTip(a,el){
            selectedTip=a;
            document.querySelectorAll('.tip-btn').forEach(e=>e.classList.remove('selected'));
            el.classList.add('selected');
            update();
        }

        function update(){
            const bolt=selectedBolt?BOLTS[selectedBolt].price:0;
            const total=baseFee+bolt+selectedTip;
            document.getElementById('sBase').textContent='$'+(baseFee/100).toFixed(2);
            document.getElementById('sBoltRow').style.display=bolt?'flex':'none';
            if(bolt){document.getElementById('sBoltL').textContent=BOLTS[selectedBolt].label;document.getElementById('sBolt').textContent='$'+(bolt/100).toFixed(2)}
            document.getElementById('sTipRow').style.display=selectedTip?'flex':'none';
            if(selectedTip)document.getElementById('sTip').textContent='$'+(selectedTip/100).toFixed(2);
            document.getElementById('sTotal').textContent='$'+(total/100).toFixed(2);
            document.getElementById('btn').textContent='⚡ Pay $'+(total/100).toFixed(2);
        }

        let isSubmitting = false;
        let STRIPE_KEY = null; // Fetched from API
        let stripe = null;
        let cardElement = null;

        async function handleSubmit(e){
            e.preventDefault();

            // Prevent double submission
            if(isSubmitting) return;
            isSubmitting = true;

            const btn=document.getElementById('btn'),err=document.getElementById('error');
            const songTitle = document.getElementById('song').value.trim();
            const artist = document.getElementById('artist').value.trim();
            const comment = document.getElementById('comment').value.trim();
            const email = document.getElementById('email').value.trim();
            const name = document.getElementById('name').value.trim();

            // Client-side validation
            if(!songTitle || songTitle.length < 1) {
                err.textContent = 'Please enter a song title';
                err.style.display = 'block';
                isSubmitting = false;
                return;
            }
            if(songTitle.length > 200) {
                err.textContent = 'Song title is too long (max 200 characters)';
                err.style.display = 'block';
                isSubmitting = false;
                return;
            }
            if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                err.textContent = 'Please enter a valid email address';
                err.style.display = 'block';
                isSubmitting = false;
                return;
            }

            btn.disabled=true;
            btn.textContent='Processing...';
            err.style.display='none';

            // Check Stripe is initialized
            if (!stripe || !cardElement) {
                const initErr = 'Payment system not loaded. Please refresh the page.';
                err.textContent = initErr;
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '⚡ Pay';
                isSubmitting = false;
                alert(initErr);
                return;
            }

            try{
                const r=await fetch(`${API}/dj/request/create-intent`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        djId,
                        songTitle,
                        artist,
                        comment,
                        boltTier:selectedBolt,
                        tipAmount:selectedTip/100, // Convert cents to dollars
                        email,
                        customerName:name
                    })
                });
                const d=await r.json();
                if(!d.success) throw new Error(d.error || 'Failed to create payment');

                // Confirm payment with card element
                const{error, paymentIntent}=await stripe.confirmCardPayment(d.clientSecret, {
                    payment_method: {
                        card: cardElement,
                        billing_details: {
                            name: name || undefined,
                            email: email || undefined
                        }
                    }
                });
                if(error) throw new Error(error.message);

                // Payment succeeded - confirm with backend
                const confirmRes = await fetch(`${API}/dj/request/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paymentIntentId: paymentIntent.id,
                        djId,
                        songTitle,
                        artist,
                        comment,
                        boltTier: selectedBolt,
                        tipAmount: selectedTip/100,
                        customerName: name,
                        customerEmail: email
                    })
                });
                const confirmData = await confirmRes.json();
                if (!confirmData.success) throw new Error(confirmData.error || 'Failed to confirm request');

                // Show success
                location.href = location.pathname + '?success=1';
            }catch(x){
                console.error('Payment error:', x);
                const errorMsg = x.message || 'Payment failed. Please try again.';
                err.textContent = errorMsg;
                err.style.display='block';
                btn.disabled=false;
                isSubmitting=false;
                update();
                // Alert for mobile debugging
                alert('Payment Error: ' + errorMsg);
            }
        }

        if(location.search.includes('success')){
            document.getElementById('djName').textContent='';
            document.getElementById('content').innerHTML=`
                <div class="success-screen">
                    <div class="success-icon">🎉</div>
                    <h2 class="success-title">Request Submitted!</h2>
                    <p class="success-message">Your request has been sent to the DJ for approval.</p>
                    <p style="color: var(--gray); font-size: 13px; margin-bottom: 24px;">
                        The DJ will accept or decline your request. If not reviewed within 24 hours, you'll receive an automatic refund.
                    </p>
                    <button class="submit-btn" onclick="location.href=location.pathname">Another Request</button>
                </div>`;
        }else init();
    </script>
</body>
</html>
