<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Host Events - Lightning Pass</title>

    <!-- Dynamic OG tags set by JS -->
    <meta property="og:title" content="Events - Lightning Pass">
    <meta property="og:description" content="Get tickets to exclusive events">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffd700'/%3E%3Cstop offset='100%25' stop-color='%23ff8c00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M55 5L15 55h25L30 95l50-55H55L70 5z'/%3E%3C/svg%3E">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pure-black: #0d1b2a;
            --card-black: #1b2838;
            --border-dark: #2d3748;
            --lightning-yellow: #ffd700;
            --electric-blue: #00d4ff;
            --electric-purple: #9d4edd;
            --neon-green: #39ff14;
            --white: #ffffff;
            --gray: #888;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--pure-black);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Banner with gradient fade into page */
        .host-banner {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, var(--card-black) 0%, var(--pure-black) 100%);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Gradient overlay - fades banner into navy */
        .host-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to bottom, transparent 0%, var(--pure-black) 100%);
            pointer-events: none;
        }

        /* Content wrapper - shared left axis */
        .host-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header overlaps banner, logo straddles seam */
        .host-header {
            position: relative;
            margin-top: -70px;
            padding-bottom: 0.75rem;
        }

        .host-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--pure-black);
            background: var(--card-black);
            object-fit: cover;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            position: relative;
            z-index: 1;
        }

        .host-info {
            margin-top: 0.75rem;
        }

        .host-name {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
        }

        .host-bio {
            color: var(--gray);
            font-size: 0.95rem;
            max-width: 560px;
            line-height: 1.5;
        }

        /* Events Section - tighter spacing */
        .events-section {
            margin-top: 1.5rem;
            padding-bottom: 3rem;
        }

        .events-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--lightning-yellow);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .event-card {
            background: var(--card-black);
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--border-dark);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .event-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.08);
        }

        .event-image {
            width: 100%;
            aspect-ratio: 4/5;
            object-fit: contain;
            background: var(--pure-black);
        }

        .event-content {
            padding: 1rem 1.25rem 1.25rem;
        }

        .event-date {
            font-size: 0.8rem;
            color: var(--electric-blue);
            font-weight: 500;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .event-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .event-location {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 0.75rem;
        }

        .event-price {
            font-size: 1rem;
            font-weight: 600;
            color: var(--lightning-yellow);
        }

        .btn-tickets {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background: var(--lightning-yellow);
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 0.5rem;
            margin-top: 0.875rem;
            transition: background 0.2s;
        }

        .btn-tickets:hover {
            background: #e6c700;
        }

        /* Empty state - styled card */
        .no-events {
            background: var(--card-black);
            border: 1px solid var(--border-dark);
            border-radius: 0.75rem;
            padding: 2.5rem 2rem;
            text-align: center;
            color: var(--gray);
            font-size: 0.95rem;
        }

        /* Loading/Error states */
        .loading {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--gray);
        }

        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            color: #ff6b6b;
        }

        /* Footer */
        .powered-by {
            text-align: center;
            padding: 2rem;
            color: var(--gray);
            font-size: 0.8rem;
        }

        .powered-by a {
            color: var(--lightning-yellow);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .host-banner {
                height: 160px;
            }
            .host-banner::after {
                height: 60px;
            }
            .host-content {
                padding: 0 1.25rem;
            }
            .host-header {
                margin-top: -50px;
            }
            .host-logo {
                width: 80px;
                height: 80px;
            }
            .host-name {
                font-size: 1.4rem;
            }
            .host-bio {
                font-size: 0.9rem;
            }
            .events-section {
                margin-top: 1.25rem;
            }
            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Banner with gradient fade -->
    <div class="host-banner" id="hostBanner"></div>

    <!-- Content wrapper - shared left axis -->
    <div class="host-content">
        <!-- Header with Logo (straddles banner seam) -->
        <div class="host-header">
            <img class="host-logo" id="hostLogo" src="" alt="Host Logo">
            <div class="host-info">
                <h1 class="host-name" id="hostName">Loading...</h1>
                <p class="host-bio" id="hostBio"></p>
            </div>
        </div>

        <!-- Events -->
        <section class="events-section">
            <h2 class="events-title">Upcoming Events</h2>
            <div class="events-grid" id="eventsGrid">
                <div class="loading">Loading events...</div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <div class="powered-by">
        Powered by <a href="https://thelightningpass.com">Lightning Pass</a>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : 'https://lightning-backend-production.up.railway.app';

        // Extract hostSlug from query params (Vercel rewrite) or path (direct access)
        // Query params are primary source due to Vercel cleanUrls + path params issue
        const urlParams = new URLSearchParams(window.location.search);
        let hostSlug = urlParams.get('h');
        let eventSlug = urlParams.get('e');

        // Fallback: parse from path if no query params (direct /h/slug or /@slug access)
        if (!hostSlug) {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts[0] === 'h' && pathParts[1]) {
                hostSlug = pathParts[1];
                eventSlug = pathParts[2];
            } else if (pathParts[0] === 'host-page') {
                // Direct /host-page access without params - show error
                hostSlug = null;
            } else if (pathParts[0] && pathParts[0].startsWith('@')) {
                hostSlug = pathParts[0].substring(1);
                eventSlug = pathParts[1];
            }
        }

        async function loadHostPage() {
            if (!hostSlug) {
                showError('Invalid host URL');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/lightning/h/${hostSlug}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    showError(data.error || 'Host not found');
                    return;
                }

                // Handle case-insensitive redirect
                if (data.redirect && data.canonicalSlug) {
                    // Redirect to canonical URL
                    const currentPath = window.location.pathname;
                    let newPath;
                    if (currentPath.startsWith('/h/')) {
                        newPath = `/h/${data.canonicalSlug}`;
                    } else {
                        newPath = `/@${data.canonicalSlug}`;
                    }
                    if (eventSlug) newPath += `/${eventSlug}`;
                    window.location.replace(newPath);
                    return;
                }

                renderHost(data.host);
                renderEvents(data.events);

                // Update page title
                document.title = `${data.host.displayName || 'Events'} - Lightning Pass`;

            } catch (err) {
                console.error('Load error:', err);
                showError('Failed to load page');
            }
        }

        function renderHost(host) {
            // Banner
            const banner = document.getElementById('hostBanner');
            if (host.banner) {
                banner.style.backgroundImage = `url(${host.banner})`;
            }

            // Logo
            const logo = document.getElementById('hostLogo');
            if (host.logo) {
                logo.src = host.logo;
            } else {
                logo.style.display = 'none';
            }

            // Info
            document.getElementById('hostName').textContent = host.displayName || host.slug;
            document.getElementById('hostBio').textContent = host.bio || '';
        }

        function renderEvents(events) {
            const grid = document.getElementById('eventsGrid');

            if (!events || events.length === 0) {
                grid.innerHTML = '<div class="no-events">No upcoming events</div>';
                return;
            }

            grid.innerHTML = events.map(event => {
                // Parse date as local (not UTC) to avoid off-by-one timezone shift
                const dateParts = event.date ? event.date.split('T')[0].split('-') : null;
                const date = dateParts ? new Date(dateParts[0], dateParts[1] - 1, dateParts[2]) : new Date();
                const dateStr = date.toLocaleDateString('en-US', {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric'
                });
                const timeStr = event.startTime ? formatTime(event.startTime) : '';

                // Get lowest ticket price
                const lowestPrice = event.tickets && event.tickets.length > 0
                    ? Math.min(...event.tickets.map(t => t.price))
                    : 0;
                const priceStr = lowestPrice > 0 ? `From $${(lowestPrice / 100).toFixed(0)}` : 'FREE';

                return `
                    <div class="event-card">
                        ${event.imageUrl ? `<img class="event-image" src="${event.imageUrl}" alt="${event.name}">` : '<div class="event-image"></div>'}
                        <div class="event-content">
                            <div class="event-date">${dateStr} ${timeStr ? '@ ' + timeStr : ''}</div>
                            <h3 class="event-name">${event.name}</h3>
                            <div class="event-location">${event.location || ''}</div>
                            <div class="event-price">${priceStr}</div>
                            <a class="btn-tickets" href="/#events" onclick="window.location.href='/?event=${event.slug}'">GET TICKETS</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':');
            const h = parseInt(hours);
            const suffix = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${minutes} ${suffix}`;
        }

        function showError(message) {
            document.getElementById('hostName').textContent = 'Not Found';
            document.getElementById('eventsGrid').innerHTML = `<div class="error">${message}</div>`;
        }

        // Load on page ready
        loadHostPage();
    </script>
    <script src="/js/lp-tracker.js" defer></script>
</body>
</html>
