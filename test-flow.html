<!DOCTYPE html>
<html>
<head>
    <title>Login Center Test</title>
    <style>
        body { font-family: system-ui; padding: 2rem; background: #1a1a2e; color: white; }
        :root { --lightning-yellow: #ffdd00; --border-dark: #333; --gray: #888; --neon-green: #39ff14; }
        .log { background: #0a0a0f; padding: 1rem; border-radius: 8px; margin-top: 1rem; white-space: pre-wrap; font-family: monospace; }
        button { padding: 1rem 2rem; background: var(--lightning-yellow); color: black; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 0.5rem; }
        .success { color: #4ade80; }
        .error { color: #ff4444; }
    </style>
</head>
<body>
    <h1>Login Center Flow Test</h1>
    <p>API: <span id="apiUrl"></span></p>

    <div>
        <button onclick="testOpen()">Test Open Modal</button>
        <button onclick="testRegister()">Test Register + Apply Discount</button>
        <button onclick="clearStorage()">Clear LocalStorage</button>
    </div>

    <div class="log" id="log"></div>

    <script src="/js/login-center.js"></script>
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : 'https://lightning-backend-production.up.railway.app';

        document.getElementById('apiUrl').textContent = API_URL;

        // Simulate the experiences.html state
        let isMemberVerified = false;
        let currentRental = { name: '2 Jet Skis', original: 260, price: 200 };

        function log(msg, type = '') {
            const el = document.getElementById('log');
            const span = document.createElement('span');
            span.className = type;
            span.textContent = new Date().toLocaleTimeString() + ' - ' + msg + '\n';
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
        }

        function updateTotal() {
            const finalTotal = isMemberVerified ? currentRental.price : currentRental.original;
            log(`updateTotal() called - isMemberVerified: ${isMemberVerified}`);
            log(`Price: $${currentRental.original} -> $${finalTotal} (${isMemberVerified ? 'MEMBER' : 'GUEST'})`, isMemberVerified ? 'success' : '');
        }

        LoginCenter.init({
            apiBase: API_URL,
            onSuccess: function(data) {
                log('onSuccess callback fired!', 'success');
                log(`Token: ${data.token.substring(0, 50)}...`);
                log(`Email: ${data.email}`);
                log(`Roles: ${JSON.stringify(data.roles)}`);

                isMemberVerified = true;
                log('isMemberVerified = true', 'success');
                updateTotal();

                log('Closing Login Center modal...');
                LoginCenter.close();
                log('Flow complete! Checkout would now show member price.', 'success');
            }
        });

        function testOpen() {
            log('Opening Login Center modal...');
            LoginCenter.open();
        }

        async function testRegister() {
            const email = `test_${Date.now()}@test.com`;
            log(`Testing registration with: ${email}`);

            try {
                const res = await fetch(`${API_URL}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName: 'Test',
                        lastName: 'User',
                        email: email,
                        phone: '5551234567',
                        password: 'testpass123',
                        userType: 'member',
                        roles: ['member']
                    })
                });
                const data = await res.json();

                if (data.token) {
                    log('Registration successful!', 'success');
                    // Simulate what onSuccess does
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userEmail', email);
                    isMemberVerified = true;
                    updateTotal();
                } else {
                    log('Registration failed: ' + JSON.stringify(data), 'error');
                }
            } catch (e) {
                log('Error: ' + e.message, 'error');
            }
        }

        function clearStorage() {
            localStorage.clear();
            isMemberVerified = false;
            log('LocalStorage cleared, isMemberVerified = false');
            updateTotal();
        }

        log('Test page loaded. Click buttons to test.');
        log(`Current token: ${localStorage.getItem('token') ? 'exists' : 'none'}`);
    </script>
</body>
</html>
