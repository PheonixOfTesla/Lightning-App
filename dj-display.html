<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Display - Lightning Pass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        :root{
            --purple:#a855f7;
            --cyan:#06b6d4;
            --gold:#fbbf24;
            --dark:#0a0a0f;
            --card:rgba(15,15,25,0.85);
        }

        body{
            font-family:'Inter',sans-serif;
            background:var(--dark);
            color:#fff;
            height:100vh;
            overflow:hidden;
        }

        /* Video Background */
        .video-bg{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            object-fit:cover;
            z-index:0;
            opacity:0.25;
        }

        /* Dark overlay */
        .overlay{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.7);
            z-index:1;
        }

        /* Color gradient overlay */
        .color-overlay{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:linear-gradient(135deg,rgba(168,85,247,0.1) 0%,rgba(6,182,212,0.08) 50%,rgba(251,191,36,0.08) 100%);
            z-index:1;
        }

        /* Main Layout */
        .container{
            position:relative;
            z-index:2;
            display:flex;
            height:100vh;
        }

        /* Left Panel */
        .left{
            width:42%;
            padding:50px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            border-right:1px solid rgba(255,255,255,0.1);
            background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.5) 100%);
        }

        /* Animated Logo */
        .logo-container{
            margin-bottom:30px;
            text-align:center;
        }

        .logo-text{
            font-size:52px;
            font-weight:900;
            letter-spacing:-2px;
            background:linear-gradient(90deg,var(--purple),var(--cyan),var(--gold));
            background-size:200% 100%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation:gradientShift 4s ease-in-out infinite;
        }

        .logo-bolt{
            display:inline-block;
            vertical-align:middle;
            margin-right:8px;
            animation:boltPulse 2s ease-in-out infinite;
            filter:drop-shadow(0 0 20px var(--cyan));
        }

        @keyframes gradientShift{
            0%,100%{background-position:0% 50%}
            50%{background-position:100% 50%}
        }

        @keyframes boltPulse{
            0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px var(--cyan))}
            50%{transform:scale(1.1);filter:drop-shadow(0 0 40px var(--purple))}
        }

        .tagline{
            font-size:18px;
            font-weight:300;
            color:rgba(255,255,255,0.7);
            letter-spacing:4px;
            text-transform:uppercase;
            margin-top:10px;
            animation:fadeInUp 1s ease-out;
        }

        /* DJ Name with glow */
        .dj-name{
            font-size:32px;
            font-weight:700;
            margin:40px 0;
            text-align:center;
            text-shadow:0 0 30px rgba(6,182,212,0.5);
            animation:textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow{
            0%,100%{text-shadow:0 0 30px rgba(6,182,212,0.5)}
            50%{text-shadow:0 0 50px rgba(168,85,247,0.8),0 0 80px rgba(6,182,212,0.4)}
        }

        /* QR Container */
        .qr-container{
            background:#fff;
            padding:20px;
            border-radius:16px;
            box-shadow:0 0 60px rgba(168,85,247,0.4),0 0 120px rgba(6,182,212,0.2);
            animation:qrFloat 4s ease-in-out infinite;
        }

        @keyframes qrFloat{
            0%,100%{transform:translateY(0);box-shadow:0 0 60px rgba(168,85,247,0.4)}
            50%{transform:translateY(-10px);box-shadow:0 0 80px rgba(6,182,212,0.6)}
        }

        .qr-container canvas{width:260px;height:260px}

        .scan-prompt{
            margin-top:30px;
            font-size:18px;
            font-weight:500;
            color:rgba(255,255,255,0.8);
            text-align:center;
        }

        .scan-prompt span{
            background:linear-gradient(90deg,var(--cyan),var(--gold));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            font-weight:700;
        }

        /* Right Panel */
        .right{
            flex:1;
            padding:50px;
            display:flex;
            flex-direction:column;
            background:rgba(0,0,0,0.4);
        }

        .queue-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .queue-title{
            font-size:28px;
            font-weight:800;
            letter-spacing:-1px;
        }

        .live-indicator{
            display:flex;
            align-items:center;
            gap:8px;
            background:rgba(255,0,68,0.2);
            border:1px solid rgba(255,0,68,0.4);
            padding:8px 16px;
            border-radius:20px;
            font-size:13px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        .live-dot{
            width:8px;height:8px;
            background:#ff0044;
            border-radius:50%;
            animation:livePulse 1.5s infinite;
        }

        @keyframes livePulse{
            0%,100%{opacity:1;transform:scale(1)}
            50%{opacity:0.5;transform:scale(1.2)}
        }

        /* Now Playing */
        .now-playing{
            background:linear-gradient(135deg,rgba(168,85,247,0.2),rgba(6,182,212,0.15));
            border:1px solid rgba(168,85,247,0.3);
            border-radius:16px;
            padding:28px;
            margin-bottom:24px;
            animation:nowPlayingPulse 4s ease-in-out infinite;
        }

        @keyframes nowPlayingPulse{
            0%,100%{border-color:rgba(168,85,247,0.3);box-shadow:0 0 30px rgba(168,85,247,0.1)}
            50%{border-color:rgba(6,182,212,0.5);box-shadow:0 0 50px rgba(6,182,212,0.2)}
        }

        .np-label{
            font-size:12px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:3px;
            color:var(--cyan);
            margin-bottom:12px;
        }

        .np-song{
            font-size:36px;
            font-weight:800;
            line-height:1.2;
            margin-bottom:8px;
            animation:textReveal 0.5s ease-out;
        }

        @keyframes textReveal{
            from{opacity:0;transform:translateY(20px)}
            to{opacity:1;transform:translateY(0)}
        }

        .np-artist{
            font-size:20px;
            color:rgba(255,255,255,0.6);
        }

        .np-requester{
            font-size:14px;
            color:rgba(255,255,255,0.4);
            margin-top:12px;
        }

        /* Queue List */
        .queue-list{
            flex:1;
            overflow:hidden;
        }

        .queue-item{
            background:var(--card);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;
            padding:18px 22px;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:18px;
            animation:slideInRight 0.4s ease-out;
            backdrop-filter:blur(10px);
        }

        @keyframes slideInRight{
            from{opacity:0;transform:translateX(40px)}
            to{opacity:1;transform:translateX(0)}
        }

        .queue-position{
            width:44px;height:44px;
            background:linear-gradient(135deg,var(--purple),var(--cyan));
            border-radius:10px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:800;
        }

        .queue-info{flex:1}
        .queue-song{font-size:18px;font-weight:700;margin-bottom:3px}
        .queue-artist{font-size:14px;color:rgba(255,255,255,0.5)}

        .queue-bolt{
            padding:6px 12px;
            border-radius:6px;
            font-size:11px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        .queue-bolt.next_5{background:rgba(251,191,36,0.2);color:var(--gold);border:1px solid rgba(251,191,36,0.3)}
        .queue-bolt.next_up{background:rgba(6,182,212,0.2);color:var(--cyan);border:1px solid rgba(6,182,212,0.3)}
        .queue-bolt.play_now{background:rgba(168,85,247,0.2);color:var(--purple);border:1px solid rgba(168,85,247,0.3)}

        /* Music toggle button */
        .music-btn{
            position:fixed;
            bottom:30px;
            right:30px;
            width:56px;
            height:56px;
            background:rgba(168,85,247,0.9);
            border:none;
            border-radius:50%;
            cursor:pointer;
            z-index:100;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.2s;
        }

        .music-btn:hover{
            background:var(--cyan);
            transform:scale(1.1);
        }

        .music-btn svg{
            width:24px;
            height:24px;
            fill:#fff;
        }

        .music-btn .pause{display:none}
        .music-btn.playing .play{display:none}
        .music-btn.playing .pause{display:block}

        /* Empty State */
        .empty{
            text-align:center;
            padding:60px 30px;
        }

        .empty-title{
            font-size:24px;
            font-weight:600;
            color:rgba(255,255,255,0.4);
            margin-bottom:10px;
        }

        .empty-sub{
            font-size:16px;
            color:rgba(255,255,255,0.25);
        }

        /* Animated particles */
        .particles{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            z-index:1;
            pointer-events:none;
            overflow:hidden;
        }

        .particle{
            position:absolute;
            width:4px;height:4px;
            background:var(--cyan);
            border-radius:50%;
            opacity:0.3;
            animation:particleFloat 15s linear infinite;
        }

        @keyframes particleFloat{
            0%{transform:translateY(100vh) rotate(0deg);opacity:0}
            10%{opacity:0.3}
            90%{opacity:0.3}
            100%{transform:translateY(-100vh) rotate(720deg);opacity:0}
        }

        /* ============================================
           RESPONSIVE STYLES - All Devices
           ============================================ */

        /* Large TVs / 4K Displays */
        @media (min-width:1920px){
            .logo-text{font-size:72px}
            .tagline{font-size:24px;letter-spacing:6px}
            .dj-name{font-size:48px}
            .qr-container{padding:30px;border-radius:24px}
            .qr-container canvas{width:350px!important;height:350px!important}
            .scan-prompt{font-size:24px}
            .queue-title{font-size:36px}
            .np-song{font-size:48px}
            .np-artist{font-size:28px}
            .queue-song{font-size:24px}
            .queue-artist{font-size:18px}
            .queue-position{width:56px;height:56px;font-size:26px}
        }

        /* Tablets / iPad */
        @media (max-width:1024px){
            .container{flex-direction:column;height:auto;min-height:100vh;overflow-y:auto}
            body{overflow-y:auto}
            .left{
                width:100%;
                padding:30px 20px;
                border-right:none;
                border-bottom:1px solid rgba(255,255,255,0.1);
            }
            .right{padding:30px 20px}
            .logo-text{font-size:42px}
            .tagline{font-size:14px;letter-spacing:3px}
            .dj-name{font-size:28px;margin:25px 0}
            .qr-container{padding:15px;border-radius:14px}
            .qr-container canvas{width:200px!important;height:200px!important}
            .scan-prompt{font-size:16px;margin-top:20px}
            .queue-header{margin-bottom:20px}
            .queue-title{font-size:24px}
            .now-playing{padding:20px}
            .np-song{font-size:28px}
            .np-artist{font-size:18px}
        }

        /* Mobile Phones */
        @media (max-width:768px){
            .container{flex-direction:column}
            .left{
                width:100%;
                padding:25px 15px;
                min-height:auto;
            }
            .right{
                padding:20px 15px;
                min-height:50vh;
            }
            .logo-container{margin-bottom:15px}
            .logo-bolt{width:32px!important;height:32px!important}
            .logo-text{font-size:32px;letter-spacing:-1px}
            .tagline{font-size:11px;letter-spacing:2px;margin-top:6px}
            .dj-name{font-size:22px;margin:20px 0}
            .qr-container{padding:12px;border-radius:12px}
            .qr-container canvas{width:160px!important;height:160px!important}
            .scan-prompt{font-size:14px;margin-top:15px}
            .queue-header{margin-bottom:15px}
            .queue-title{font-size:20px}
            .live-indicator{padding:6px 12px;font-size:11px}
            .live-dot{width:6px;height:6px}
            .now-playing{padding:16px;margin-bottom:16px;border-radius:12px}
            .np-label{font-size:10px;letter-spacing:2px;margin-bottom:8px}
            .np-song{font-size:22px}
            .np-artist{font-size:16px}
            .np-requester{font-size:12px}
            .queue-item{padding:14px 16px;margin-bottom:10px;border-radius:10px;gap:12px}
            .queue-position{width:36px;height:36px;font-size:16px;border-radius:8px}
            .queue-song{font-size:15px}
            .queue-artist{font-size:12px}
            .queue-bolt{padding:4px 8px;font-size:9px}
            .music-btn{width:48px;height:48px;bottom:20px;right:20px}
            .music-btn svg{width:20px;height:20px}
            .empty{padding:40px 20px}
            .empty-title{font-size:18px}
            .empty-sub{font-size:14px}
        }

        /* Small phones */
        @media (max-width:375px){
            .left{padding:20px 12px}
            .right{padding:15px 12px}
            .logo-text{font-size:28px}
            .tagline{font-size:10px;letter-spacing:1px}
            .dj-name{font-size:18px;margin:15px 0}
            .qr-container canvas{width:140px!important;height:140px!important}
            .scan-prompt{font-size:12px}
            .queue-title{font-size:18px}
            .np-song{font-size:18px}
            .queue-song{font-size:14px}
        }

        /* Landscape phone orientation */
        @media (max-width:900px) and (orientation:landscape){
            .container{flex-direction:row}
            .left{
                width:40%;
                padding:20px;
                border-right:1px solid rgba(255,255,255,0.1);
                border-bottom:none;
            }
            .right{width:60%;padding:20px}
            .logo-text{font-size:28px}
            .tagline{font-size:10px}
            .dj-name{font-size:20px;margin:15px 0}
            .qr-container canvas{width:120px!important;height:120px!important}
            .scan-prompt{font-size:12px;margin-top:10px}
            .queue-item{padding:10px 12px}
            .queue-position{width:32px;height:32px;font-size:14px}
            .np-song{font-size:20px}
        }

        /* Connection status indicator */
        .connection-status{
            position:fixed;
            top:20px;
            right:20px;
            display:flex;
            align-items:center;
            gap:8px;
            padding:8px 16px;
            border-radius:20px;
            font-size:12px;
            font-weight:600;
            z-index:100;
            transition:all 0.3s;
        }
        .connection-status.connected{
            background:rgba(34,197,94,0.2);
            border:1px solid rgba(34,197,94,0.4);
            color:#22c55e;
        }
        .connection-status.disconnected{
            background:rgba(239,68,68,0.2);
            border:1px solid rgba(239,68,68,0.4);
            color:#ef4444;
        }
        .connection-status.connecting{
            background:rgba(251,191,36,0.2);
            border:1px solid rgba(251,191,36,0.4);
            color:#fbbf24;
        }
        .status-dot{
            width:8px;
            height:8px;
            border-radius:50%;
            background:currentColor;
        }
        .connection-status.connected .status-dot{
            animation:pulse 2s infinite;
        }
        .connection-status.connecting .status-dot{
            animation:blink 1s infinite;
        }
        @keyframes pulse{
            0%,100%{opacity:1}
            50%{opacity:0.5}
        }
        @keyframes blink{
            0%,100%{opacity:1}
            50%{opacity:0.2}
        }

        /* Error state */
        .error-state{
            text-align:center;
            padding:40px;
            background:rgba(239,68,68,0.1);
            border:1px solid rgba(239,68,68,0.3);
            border-radius:12px;
            margin:20px 0;
        }
        .error-state svg{
            width:48px;
            height:48px;
            fill:#ef4444;
            margin-bottom:15px;
        }
        .error-title{
            font-size:18px;
            font-weight:600;
            color:#ef4444;
            margin-bottom:8px;
        }
        .error-message{
            font-size:14px;
            color:rgba(255,255,255,0.6);
        }
        .retry-btn{
            margin-top:15px;
            padding:10px 24px;
            background:linear-gradient(135deg,var(--purple),var(--cyan));
            border:none;
            border-radius:8px;
            color:#fff;
            font-weight:600;
            cursor:pointer;
        }
        .retry-btn:hover{transform:scale(1.05)}
    </style>
</head>
<body>
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="/background-video.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop preload="auto">
        <source src="/background-music.mp3" type="audio/mpeg">
    </audio>

    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
        <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="connection-status connecting" id="connectionStatus">
        <div class="status-dot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <div class="overlay"></div>
    <div class="color-overlay"></div>

    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="left">
            <div class="logo-container">
                <div>
                    <svg class="logo-bolt" viewBox="0 0 24 24" width="48" height="48"><path fill="url(#bolt-grad)" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/><defs><linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient></defs></svg>
                    <span class="logo-text">LIGHTNING PASS</span>
                </div>
                <div class="tagline">Skip the Line. Live the Night.</div>
            </div>

            <div class="dj-name" id="djName">Loading...</div>

            <div class="qr-container">
                <canvas id="qrCode"></canvas>
            </div>

            <div class="scan-prompt">Scan to <span>request a song</span></div>
        </div>

        <div class="right">
            <div class="queue-header">
                <div class="queue-title">Song Queue</div>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    LIVE
                </div>
            </div>

            <div class="now-playing" id="nowPlaying" style="display:none">
                <div class="np-label">Now Playing</div>
                <div class="np-song" id="npSong"></div>
                <div class="np-artist" id="npArtist"></div>
                <div class="np-requester" id="npRequester"></div>
            </div>

            <div class="queue-list" id="queueList">
                <div class="empty">
                    <div class="empty-title">No songs in queue</div>
                    <div class="empty-sub">Scan the QR code to request a song</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script>
        const API='https://lightning-backend-production.up.railway.app';
        const djId=window.location.pathname.split('/').pop();
        let socket = null;
        let nowPlayingSong = null;
        let retryCount = 0;
        const MAX_RETRIES = 3;

        // Connection status management
        function setConnectionStatus(status, text) {
            const el = document.getElementById('connectionStatus');
            const textEl = document.getElementById('statusText');
            el.className = 'connection-status ' + status;
            textEl.textContent = text;
        }

        // Create floating particles
        function createParticles(){
            const container=document.getElementById('particles');
            for(let i=0;i<20;i++){
                const p=document.createElement('div');
                p.className='particle';
                p.style.left=Math.random()*100+'%';
                p.style.animationDelay=Math.random()*15+'s';
                p.style.animationDuration=(10+Math.random()*10)+'s';
                if(Math.random()>0.5)p.style.background='#a855f7';
                if(Math.random()>0.7)p.style.background='#fbbf24';
                container.appendChild(p);
            }
        }
        createParticles();

        // Show error state in queue area
        function showError(title, message) {
            const list = document.getElementById('queueList');
            list.innerHTML = `
                <div class="error-state">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    <div class="error-title">${title}</div>
                    <div class="error-message">${message}</div>
                    <button class="retry-btn" onclick="retryInit()">Retry</button>
                </div>
            `;
        }

        function retryInit() {
            retryCount = 0;
            const list = document.getElementById('queueList');
            list.innerHTML = '<div class="empty"><div class="empty-title">Loading...</div></div>';
            init();
        }

        async function init(){
            if(!djId||djId==='dj-display'){
                showError('Invalid URL', 'DJ ID not found in URL');
                return;
            }

            setConnectionStatus('connecting', 'Connecting...');

            // Always generate QR code first
            const qrUrl=`https://thelightningpass.com/dj/${djId}`;
            try{
                QRCode.toCanvas(document.getElementById('qrCode'),qrUrl,{width:260,margin:0,color:{dark:'#000',light:'#fff'}});
            }catch(qrErr){
                console.error('QR generation failed:',qrErr);
            }

            try{
                const r=await fetch(`${API}/api/v1/lightning/dj/${djId}/public`);
                if(!r.ok) throw new Error(`HTTP ${r.status}`);
                const d=await r.json();
                if(d.success){
                    document.getElementById('djName').textContent=d.dj.name;
                    retryCount = 0;
                } else {
                    throw new Error(d.error || 'Failed to load DJ info');
                }

                await fetchQueue();
                connectSocket();
                setInterval(fetchQueue, 30000);

            }catch(e){
                console.error('Init error:', e);
                retryCount++;
                if(retryCount < MAX_RETRIES) {
                    setConnectionStatus('connecting', `Retrying (${retryCount}/${MAX_RETRIES})...`);
                    setTimeout(init, 3000);
                } else {
                    setConnectionStatus('disconnected', 'Offline');
                    showError('Connection Failed', 'Unable to connect to server. Check your internet connection.');
                }
            }
        }

        function connectSocket(){
            socket = io(API, { transports: ['websocket', 'polling'] });

            socket.on('connect', () => {
                console.log('Socket connected');
                setConnectionStatus('connected', 'Live');
                socket.emit('join:dj', djId);
            });

            socket.on('dj:request:new', (data) => {
                console.log('New request:', data);
                fetchQueue();
            });

            socket.on('dj:request:played', (data) => {
                console.log('Request played:', data);
                // Update now playing with the played song
                updateNowPlaying(data.songTitle, data.artist);
                fetchQueue();
            });

            socket.on('dj:request:rejected', (data) => {
                console.log('Request rejected:', data);
                fetchQueue();
            });

            socket.on('disconnect', () => {
                console.log('Socket disconnected');
                setConnectionStatus('disconnected', 'Reconnecting...');
            });

            socket.on('reconnect', () => {
                console.log('Socket reconnected');
                setConnectionStatus('connected', 'Live');
                socket.emit('join:dj', djId);
                fetchQueue();
            });

            socket.on('connect_error', (err) => {
                console.error('Socket error:', err);
                setConnectionStatus('disconnected', 'Connection error');
            });
        }

        function updateNowPlaying(songTitle, artist) {
            const np = document.getElementById('nowPlaying');
            const npSong = document.getElementById('npSong');
            const npArtist = document.getElementById('npArtist');

            if(songTitle) {
                npSong.textContent = songTitle;
                npArtist.textContent = artist || '';
                np.style.display = 'block';
                nowPlayingSong = { songTitle, artist };

                // Auto-hide after 60 seconds
                setTimeout(() => {
                    if(nowPlayingSong && nowPlayingSong.songTitle === songTitle) {
                        np.style.display = 'none';
                        nowPlayingSong = null;
                    }
                }, 60000);
            }
        }

        async function fetchQueue(){
            try{
                const r=await fetch(`${API}/api/v1/lightning/dj/${djId}/queue/public`);
                if(!r.ok) throw new Error(`HTTP ${r.status}`);
                const d=await r.json();
                if(d.success) updateQueue(d.queue);
            }catch(e){
                console.error('Queue fetch error:', e);
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if(!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateQueue(queue){
            const list=document.getElementById('queueList');
            if(!queue||queue.length===0){
                list.innerHTML='<div class="empty"><div class="empty-title">No songs in queue</div><div class="empty-sub">Scan the QR code to request a song</div></div>';
                return;
            }
            list.innerHTML=queue.slice(0,8).map((item,i)=>`
                <div class="queue-item" style="animation-delay:${i*0.1}s">
                    <div class="queue-position">${i+1}</div>
                    <div class="queue-info">
                        <div class="queue-song">${escapeHtml(item.songTitle)}</div>
                        <div class="queue-artist">${escapeHtml(item.artist)||'Unknown Artist'}</div>
                    </div>
                    ${item.boltTier?`<div class="queue-bolt ${item.boltTier}">${item.boltTier.replace('_',' ').toUpperCase()}</div>`:''}
                </div>
            `).join('');
        }

        init();

        // Music toggle
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        music.volume = 0.4;

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicBtn.classList.add('playing');
            } else {
                music.pause();
                musicBtn.classList.remove('playing');
            }
        }
    </script>
</body>
</html>
