<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Owner Console - Lightning Pass</title>
    <!--
      The Owner experience is served by the admin console (admin.html), which
      renders as "Owner Console" for accounts holding the owner role. Owner is a
      permission layer above admin, not a separate app, so /owner routes there
      rather than duplicating the console. Query string (e.g. ?stripe=return) is
      preserved so Stripe onboarding returns land correctly.
    -->
    <script>
        (function () {
            var target = '/admin' + (window.location.search || '') + (window.location.hash || '');
            window.location.replace(target);
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=/admin">
    <style>
        html, body { margin: 0; height: 100%; background: #0d1b2a; color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .wrap { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
        a { color: #ffdd00; }
    </style>
</head>
<body>
    <div class="wrap">
        <div>Opening the Owner Console…</div>
        <div style="color:#888; font-size:0.9rem;">If you are not redirected, <a href="/admin">continue to the console</a>.</div>
    </div>
</body>
</html>
