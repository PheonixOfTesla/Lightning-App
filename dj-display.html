<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Display - Lightning Pass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#000;color:#fff;height:100vh;overflow:hidden;display:flex}

        /* Animated Background */
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0}
        .bg::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(255,221,0,0.1) 0%,transparent 50%,rgba(157,78,221,0.1) 100%);animation:pulse 4s ease-in-out infinite}
        .bg::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,221,0,0.05) 0%,transparent 40%);animation:rotate 20s linear infinite}
        @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
        @keyframes rotate{to{transform:rotate(360deg)}}

        /* Layout */
        .container{position:relative;z-index:1;display:flex;width:100%;height:100%}

        /* Left Panel - QR & Branding */
        .left{width:40%;padding:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid #222}
        .logo{font-size:48px;font-weight:900;background:linear-gradient(135deg,#ffdd00,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;text-align:center}
        .dj-name{font-size:36px;font-weight:700;margin-bottom:40px;text-align:center}
        .qr-container{background:#fff;padding:20px;border-radius:20px;margin-bottom:30px;box-shadow:0 0 60px rgba(255,221,0,0.3)}
        .qr-container img,.qr-container canvas{width:280px;height:280px}
        .scan-text{font-size:20px;font-weight:600;color:#888;text-align:center}
        .scan-text span{color:#ffdd00}

        /* Right Panel - Queue */
        .right{flex:1;padding:60px;display:flex;flex-direction:column}
        .queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
        .queue-title{font-size:32px;font-weight:800}
        .live-badge{background:#ff0044;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}

        /* Now Playing */
        .now-playing{background:linear-gradient(135deg,rgba(255,221,0,0.2),rgba(255,140,0,0.1));border:2px solid #ffdd00;border-radius:20px;padding:30px;margin-bottom:30px}
        .np-label{font-size:14px;font-weight:700;color:#ffdd00;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
        .np-song{font-size:42px;font-weight:800;margin-bottom:8px;line-height:1.2}
        .np-artist{font-size:24px;color:#888}
        .np-requester{font-size:16px;color:#666;margin-top:15px}

        /* Queue List */
        .queue-list{flex:1;overflow:hidden}
        .queue-item{background:#111;border:1px solid #222;border-radius:16px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px;animation:slideIn 0.3s ease-out}
        @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
        .queue-position{width:50px;height:50px;background:linear-gradient(135deg,#ffdd00,#ff8c00);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#000}
        .queue-info{flex:1}
        .queue-song{font-size:22px;font-weight:700;margin-bottom:4px}
        .queue-artist{font-size:16px;color:#888}
        .queue-bolt{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700}
        .queue-bolt.next_5{background:rgba(255,221,0,0.2);color:#ffdd00}
        .queue-bolt.next_up{background:rgba(0,212,255,0.2);color:#00d4ff}
        .queue-bolt.play_now{background:rgba(157,78,221,0.2);color:#9d4edd}

        /* Empty State */
        .empty{text-align:center;padding:80px 40px;color:#444}
        .empty-icon{font-size:80px;margin-bottom:20px}
        .empty h3{font-size:28px;margin-bottom:10px;color:#666}
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="left">
            <div class="logo">⚡ LIGHTNING PASS</div>
            <div class="dj-name" id="djName">Loading...</div>
            <div class="qr-container" id="qrContainer">
                <canvas id="qrCode"></canvas>
            </div>
            <div class="scan-text">Scan to <span>request a song</span></div>
        </div>
        <div class="right">
            <div class="queue-header">
                <div class="queue-title">🎵 Song Queue</div>
                <div class="live-badge">● LIVE</div>
            </div>
            <div class="now-playing" id="nowPlaying" style="display:none">
                <div class="np-label">Now Playing</div>
                <div class="np-song" id="npSong"></div>
                <div class="np-artist" id="npArtist"></div>
                <div class="np-requester" id="npRequester"></div>
            </div>
            <div class="queue-list" id="queueList">
                <div class="empty">
                    <div class="empty-icon">🎶</div>
                    <h3>No songs in queue</h3>
                    <p>Scan the QR code to request a song!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const API='https://lightning-backend-production.up.railway.app';
        const djId=window.location.pathname.split('/').pop();
        let socket;

        async function init(){
            if(!djId||djId==='dj-display')return;

            try{
                // Fetch DJ info
                const r=await fetch(`${API}/api/v1/lightning/dj/${djId}/public`);
                const d=await r.json();
                if(d.success){
                    document.getElementById('djName').textContent=d.dj.name;

                    // Generate QR code
                    const qrUrl=`https://thelightningpass.com/dj/${djId}`;
                    QRCode.toCanvas(document.getElementById('qrCode'),qrUrl,{width:280,margin:0,color:{dark:'#000',light:'#fff'}});
                }

                // Connect to WebSocket for live updates
                socket=io(API);
                socket.emit('join:dj',djId);

                socket.on('queue:update',updateQueue);
                socket.on('now-playing:update',updateNowPlaying);

                // Fetch initial queue
                fetchQueue();

                // Poll every 5s as backup
                setInterval(fetchQueue,5000);

            }catch(e){console.error(e)}
        }

        async function fetchQueue(){
            try{
                const r=await fetch(`${API}/api/v1/lightning/dj/${djId}/queue/public`);
                const d=await r.json();
                if(d.success)updateQueue(d.queue);
            }catch(e){}
        }

        function updateQueue(queue){
            const list=document.getElementById('queueList');
            if(!queue||queue.length===0){
                list.innerHTML='<div class="empty"><div class="empty-icon">🎶</div><h3>No songs in queue</h3><p>Scan the QR code to request a song!</p></div>';
                return;
            }

            list.innerHTML=queue.slice(0,6).map((item,i)=>`
                <div class="queue-item">
                    <div class="queue-position">${i+1}</div>
                    <div class="queue-info">
                        <div class="queue-song">${item.songTitle}</div>
                        <div class="queue-artist">${item.artist||'Unknown Artist'}</div>
                    </div>
                    ${item.boltTier?`<div class="queue-bolt ${item.boltTier}">${item.boltTier.replace('_',' ').toUpperCase()}</div>`:''}
                </div>
            `).join('');
        }

        function updateNowPlaying(song){
            const np=document.getElementById('nowPlaying');
            if(!song){np.style.display='none';return}
            np.style.display='block';
            document.getElementById('npSong').textContent=song.songTitle;
            document.getElementById('npArtist').textContent=song.artist||'Unknown Artist';
            document.getElementById('npRequester').textContent=song.customerName?`Requested by ${song.customerName}`:'';
        }

        init();
    </script>
</body>
</html>
