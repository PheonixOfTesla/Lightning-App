<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>Sarasota Events Calendar | Lightning Pass - What's Happening This Week</title>
    <meta name="description" content="Browse upcoming events in Sarasota by date. Find concerts, nightlife, farmers markets, and parties happening this week in Southwest Florida.">
    <meta name="keywords" content="Sarasota events calendar, Sarasota events this week, things to do Sarasota, Sarasota nightlife calendar, SRQ events today">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://thelightningpass.com/calendar">

    <!-- Geographic Meta Tags -->
    <meta name="geo.region" content="US-FL">
    <meta name="geo.placename" content="Sarasota">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffd700'/%3E%3Cstop offset='100%25' stop-color='%23ff8c00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M55 5L15 55h25L30 95l50-55H55L70 5z'/%3E%3C/svg%3E">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://thelightningpass.com/calendar">
    <meta property="og:title" content="Sarasota Events Calendar | Lightning Pass">
    <meta property="og:description" content="Browse upcoming events in Sarasota by date. Find what's happening this week.">
    <meta property="og:image" content="https://thelightningpass.com/logo.png">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pure-black: #0d1b2a;
            --card-black: #1b2838;
            --border-dark: #2d3748;
            --lightning-yellow: #ffdd00;
            --champagne-gold: #d4af37;
            --electric-blue: #00d4ff;
            --white: #ffffff;
            --gray: #888;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--pure-black);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background: var(--pure-black);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0.875rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--white);
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
        }

        .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: var(--white);
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            color: var(--lightning-yellow);
        }

        .nav-link.active {
            color: var(--lightning-yellow);
        }

        .btn {
            padding: 0.5rem 1.5rem;
            border: 1px solid var(--lightning-yellow);
            border-radius: 0.5rem;
            color: var(--lightning-yellow);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.875rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--lightning-yellow);
            color: var(--pure-black);
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--gray);
        }

        /* Calendar Navigation */
        .calendar-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .date-btn {
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--border-dark);
            border-radius: 0.5rem;
            background: transparent;
            color: var(--white);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .date-btn:hover {
            border-color: var(--lightning-yellow);
            color: var(--lightning-yellow);
        }

        .date-btn.active {
            background: var(--lightning-yellow);
            border-color: var(--lightning-yellow);
            color: var(--pure-black);
            font-weight: 600;
        }

        .date-btn .day-name {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .date-btn .day-num {
            display: block;
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Events List */
        .events-section {
            margin-bottom: 3rem;
        }

        .events-section h2 {
            font-size: 1.1rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-dark);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .event-card {
            background: var(--card-black);
            border: 1px solid var(--border-dark);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .event-card:hover {
            border-color: var(--lightning-yellow);
            transform: translateY(-2px);
        }

        .event-time {
            font-size: 0.85rem;
            color: var(--lightning-yellow);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .event-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .event-location {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 0.75rem;
        }

        .event-location a {
            color: var(--gray);
            text-decoration: underline;
        }

        .event-description {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-dark);
        }

        .event-price {
            font-weight: 600;
            color: var(--white);
        }

        .event-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .event-badge.community {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }

        .event-badge.recurring {
            background: rgba(255, 221, 0, 0.15);
            color: var(--lightning-yellow);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            border-radius: 2rem;
            background: var(--lightning-yellow);
            color: var(--pure-black);
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-small:hover {
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--gray);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--gray);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer a {
            color: var(--lightning-yellow);
            text-decoration: none;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
                font-size: 0.85rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .calendar-nav {
                gap: 0.25rem;
            }

            .date-btn {
                padding: 0.5rem 0.75rem;
            }

            .date-btn .day-num {
                font-size: 1rem;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            z-index: 1001;
        }

        .hamburger span {
            width: 24px;
            height: 2px;
            background: var(--white);
            transition: all 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 27, 42, 0.98);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .mobile-menu.active {
            display: flex;
        }

        .mobile-menu a {
            color: var(--white);
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .mobile-menu a:hover,
        .mobile-menu a.active {
            color: var(--lightning-yellow);
        }

        @media (max-width: 480px) {
            nav {
                padding: 0.75rem 1rem;
            }

            .nav-links {
                display: none;
            }

            .hamburger {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">
                <div style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden;">
                    <img src="logo.png" alt="Lightning Pass" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <span class="logo-text">Lightning Pass</span>
            </a>
            <div class="nav-links">
                <a href="/?browse=1" class="nav-link">Events</a>
                <a href="/partners" class="nav-link">Partners</a>
                <a href="/calendar" class="nav-link active">Calendar</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/login" class="btn">LOGIN</a>
            </div>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="/?browse=1">Events</a>
        <a href="/partners">Partners</a>
        <a href="/calendar" class="active">Calendar</a>
        <a href="/about">About</a>
        <a href="/login">Login</a>
    </div>

    <main>
        <div class="page-header">
            <h1>Events Calendar</h1>
            <p>What's happening in Sarasota</p>
        </div>

        <div class="calendar-nav" id="dateNav">
            <!-- Populated by JS -->
        </div>

        <div id="eventsContainer">
            <div class="loading">Loading events...</div>
        </div>
    </main>

    <footer>
        <p>Lightning Pass &copy; 2026 | <a href="/?browse=1">Events</a> | <a href="/partners">Partners</a> | <a href="/calendar">Calendar</a> | <a href="/about">About</a></p>
        <p style="margin-top: 0.5rem;">Sarasota, Florida</p>
    </footer>

    <script>
        const API_URL = 'https://lightning-backend-production.up.railway.app/api/v1/lightning';

        let allEvents = [];
        let selectedFilter = 'all'; // 'all' or a date string

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            buildDateNav();
            loadEvents();
        });

        // Build date navigation (ALL + 7 days)
        function buildDateNav() {
            const nav = document.getElementById('dateNav');
            const days = [];
            const today = new Date();

            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                days.push(date);
            }

            // Add "ALL" button first
            let html = `<button class="date-btn active" data-date="all">
                <span class="day-name">VIEW</span>
                <span class="day-num">ALL</span>
            </button>`;

            html += days.map((date) => {
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = date.getDate();
                return `
                    <button class="date-btn" data-date="${date.toISOString().split('T')[0]}">
                        <span class="day-name">${dayName}</span>
                        <span class="day-num">${dayNum}</span>
                    </button>
                `;
            }).join('');

            nav.innerHTML = html;

            // Add click handlers
            nav.querySelectorAll('.date-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    nav.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedFilter = btn.dataset.date;
                    renderEvents();
                });
            });
        }

        // Load events from API
        async function loadEvents() {
            try {
                const response = await fetch(`${API_URL}/public-events`);
                const data = await response.json();
                allEvents = data.events || [];
                renderEvents();
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('eventsContainer').innerHTML = `
                    <div class="empty-state">
                        <p>Failed to load events. Please try again.</p>
                    </div>
                `;
            }
        }

        // Render events
        function renderEvents() {
            const container = document.getElementById('eventsContainer');

            // Get events to display
            let eventsToShow = [];

            if (selectedFilter === 'all') {
                // Show all events, sorted by date
                eventsToShow = [...allEvents].sort((a, b) => new Date(a.date) - new Date(b.date));
            } else {
                // Filter by selected date
                const selectedDate = new Date(selectedFilter);
                eventsToShow = allEvents.filter(event => {
                    const eventDate = new Date(event.date);
                    const eventDateStr = eventDate.toISOString().split('T')[0];

                    // For recurring events, check if it's the same day of week
                    if (event.isRecurring) {
                        return eventDate.getDay() === selectedDate.getDay();
                    }

                    return eventDateStr === selectedFilter;
                });
            }

            if (eventsToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <p>No events found</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Check back soon for new events</p>
                    </div>
                `;
                return;
            }

            // Group events by date
            const eventsByDate = {};
            eventsToShow.forEach(event => {
                const eventDate = new Date(event.date);
                const dateKey = eventDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                if (!eventsByDate[dateKey]) {
                    eventsByDate[dateKey] = [];
                }
                eventsByDate[dateKey].push(event);
            });

            let html = '';
            for (const [dateStr, events] of Object.entries(eventsByDate)) {
                html += renderSection(dateStr, events);
            }

            if (html === '') {
                html = renderSection('Events', dayEvents);
            }

            container.innerHTML = html;
        }

        // Render a section of events
        function renderSection(title, events) {
            return `
                <div class="events-section">
                    <h2>${title}</h2>
                    <div class="events-grid">
                        ${events.map(event => renderEventCard(event)).join('')}
                    </div>
                </div>
            `;
        }

        // Render single event card
        function renderEventCard(event) {
            const eventDate = new Date(event.date);
            const timeStr = eventDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const price = event.tickets?.[0]?.price ? `$${(event.tickets[0].price / 100).toFixed(0)}` : 'FREE';
            const isCommunity = event.eventType === 'community';

            return `
                <div class="event-card">
                    <div class="event-time">${timeStr}</div>
                    <div class="event-name">${event.name}</div>
                    ${event.location ? `<div class="event-location"><a href="https://maps.apple.com/?q=${encodeURIComponent(event.location)}" target="_blank">${event.location}</a></div>` : ''}
                    <div class="event-description">${event.description || ''}</div>
                    <div class="event-footer">
                        <div>
                            <span class="event-price">${price}</span>
                            ${isCommunity ? '<span class="event-badge community">Community</span>' : ''}
                            ${event.isRecurring ? '<span class="event-badge recurring">Weekly</span>' : ''}
                        </div>
                        ${!isCommunity ? `<a href="/?event=${event.slug}" class="btn-small">Get Tickets</a>` : ''}
                    </div>
                </div>
            `;
        }

        // Mobile menu toggle
        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('mobileMenu').classList.toggle('active');
            document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('active') ? 'hidden' : '';
        }

        // Scroll to top on page load
        window.scrollTo(0, 0);
    </script>
</body>
</html>
