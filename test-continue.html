<!DOCTYPE html>
<html>
<head>
    <title>Test CONTINUE Button</title>
    <style>
        :root { --lightning-yellow: #ffdd00; --neon-green: #39ff14; --border-dark: #333; --gray: #888; }
        body { background: #1a1a2e; color: white; font-family: system-ui; padding: 2rem; }
        .log { background: #0a0a0f; padding: 1rem; border-radius: 8px; white-space: pre-wrap; font-family: monospace; margin-top: 1rem; }
        button { padding: 1rem 2rem; margin: 0.5rem; cursor: pointer; }
    </style>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <h1>Test CONTINUE Button</h1>

    <button onclick="openAndShowSuccess()">Open Modal + Show Success</button>
    <button onclick="testOnSuccessClick()">Test onSuccessClick Directly</button>

    <div class="log" id="log"></div>

    <script src="/js/login-center.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';

        function log(msg) {
            document.getElementById('log').textContent += new Date().toLocaleTimeString() + ' - ' + msg + '\n';
            console.log(msg);
        }

        LoginCenter.init({
            apiBase: API_URL,
            onSuccess: function(data) {
                log('onSuccess callback FIRED!');
                log('Token: ' + (data.token ? data.token.substring(0, 30) + '...' : 'none'));
                log('Email: ' + data.email);
                log('Roles: ' + JSON.stringify(data.roles));
            }
        });

        function openAndShowSuccess() {
            log('Opening modal...');
            LoginCenter.open();

            // Simulate showing success state
            setTimeout(() => {
                log('Showing success modal...');
                document.querySelector('#loginCenterModal .pass-modal-form-container').style.display = 'none';
                document.querySelector('#loginCenterModal .pass-modal-success').classList.add('active');
                log('Now click CONTINUE in the modal');
            }, 500);
        }

        function testOnSuccessClick() {
            log('Calling LoginCenter.onSuccessClick() directly...');
            try {
                LoginCenter.onSuccessClick();
                log('onSuccessClick completed without error');
            } catch (e) {
                log('ERROR: ' + e.message);
                console.error(e);
            }
        }

        // Add click listener to catch ALL clicks and see if button is receiving them
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                log('CLICK detected on button: "' + e.target.textContent + '"');
                log('  onclick attribute: ' + e.target.getAttribute('onclick'));
            }
        }, true); // capture phase

        log('Page loaded. LoginCenter defined: ' + (typeof LoginCenter !== 'undefined'));
        log('onSuccessClick defined: ' + (typeof LoginCenter.onSuccessClick === 'function'));
    </script>
</body>
</html>
